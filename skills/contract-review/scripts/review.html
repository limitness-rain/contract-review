<!doctype html>
<html lang="zh-CN">

<style>

body { margin:0; background:var(--ground); color:var(--ink); }
button,input,select,textarea { font:inherit; color:inherit; }

select,input[type=search],input[type=text],textarea { padding:5px 8px; min-width:0; }
textarea { width:100%; resize:vertical; display:block; }

<body>
<div id="app"></div>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
"use strict";

const root = document.querySelector("#app");
const dataTag = document.querySelector("#review-data");
const stageNames = {student:"同学复核", lawyer:"律师复核", final:"律师已复核"};
const keyEvidence = "风险判断关键证据";
const keyRelevant = "条款与规则是否相关";
const defaultRisk = "是否触发该风险";
const keyClause = "条款原文";
const fieldHints = {
  "合同附件名称":"与本次使用的合同文件名一致。",
  "风险名称":"沿用专家规则名称。",
  "立场":"把合同当事人映射到专家规则的角色。",
  "风险等级":"取自对应专家规则。",
  "审查逻辑":"保留专家规则全文。",
  "条款类型":"填写正式分类名称。",
  "条款原文":"保留对应一级条款的完整原文，含标题、表格和换行。摘录写入关键证据，拟改文字写入修订建议。全文缺失记录留空。",
  "关联条款类型":"填写正式分类名称。",
  "关联条款属性":"使用模板里的中文选项。",
  "关联条款原文":"摘录影响判断的完整一级条款。",
  "风险说明":"说明本合同中成立的风险及影响。",
  "修订建议":"写成可直接使用的合同条款。"
};
const wideFields = new Set(["条款原文", "审查逻辑", "关联条款原文", keyEvidence, "风险说明", "修订建议"]);
const stageFileNames = {student:"同学复核中", lawyer:"给律师复核", final:"律师已复核"};
const packageMode = typeof bootPackage === "function";
const isTemplate = dataTag.textContent.trim() === "__REVIEW_DATA__";
let model;
try {
  model = isTemplate ? {contracts:[],rows:[],fields:[]} : JSON.parse(dataTag.textContent);
  if (!Array.isArray(model.contracts) || !Array.isArray(model.rows) || !Array.isArray(model.fields)) {
    throw new Error("缺少合同、标注记录或字段");
  }
} catch (error) {
  root.textContent = "复核页数据无法读取。请使用工具重新生成页面。";
  throw error;
}
model.stage = stageNames[model.stage] ? model.stage : "student";
let questions, suggestions, hasLawyerPane, riskField, binaryFields, fieldGroups;
const contractById = new Map();
const rulesById = new Map();
const rowById = new Map();
const knownPaths = new Map();
let contractId;
function bindModel() {
  questions = model.review_questions ?? [];
  suggestions = model.lawyer_suggestions ?? [];
  hasLawyerPane = packageMode || model.stage !== "student";
  riskField = [defaultRisk, "是否有风险", "有无风险"].find(key => model.fields.includes(key)) || defaultRisk;
  binaryFields = new Set([keyRelevant, riskField]);
  fieldGroups = [
    {title:"合同与专家规则", fields:["合同附件名称","风险名称","立场","风险等级","审查逻辑"]},
    {title:"主条款", fields:["条款类型",keyClause]},
    {title:"风险判断", fields:[keyRelevant,riskField,keyEvidence]},
    {title:"关联条款", fields:["关联条款类型","关联条款属性","关联条款原文"]},
    {title:"风险说明与修订建议", fields:["风险说明","修订建议"]}
  ];
  const groupedFields = fieldGroups.flatMap(group => group.fields);
  const otherFields = model.fields.filter(field => !groupedFields.includes(field));
  if (otherFields.length) fieldGroups.push({title:"其他字段",fields:otherFields});
  contractById.clear();
  rulesById.clear();
  knownPaths.clear();
  for (const item of model.contracts) contractById.set(String(item.id),item);
  for (const item of model.rules || []) rulesById.set(String(item.id),item);
  for (const item of model.paths || []) knownPaths.set(JSON.stringify([item.contract_id,item.rule_id]),item.mode);
  contractId = String(model.contracts[0]?.id ?? "");
}
bindModel();
let selected = "";
let linked = true;
const scrollInset = 11;
const expectedScroll = new WeakMap();
let scrollFrame = 0;
let pendingSide = "";
let lastUserSide = "left";
let activeSectionId = "";
let openEditor = "";
let dirty = false;
const rowElements = new Map();
const leftSections = new Map();
const rightSections = new Map();
const norm = value => String(value ?? "").replace(/\s/g,"");
const asText = value => Array.isArray(value) ? value.join("\n") : String(value ?? "");

function enablePanelResizing(study) {
  const panes = [...study.children];
  const dividers = [];
  const readWidths = () => panes.map(pane=>pane.getBoundingClientRect().width);
  function updateValues(widths) {
    dividers.forEach((divider,index)=>{
      const pair = widths[index] + widths[index+1];
      const minimum = Math.min(200,pair/2);
      divider.setAttribute("aria-valuemin",Math.round(100*minimum/pair));
      divider.setAttribute("aria-valuemax",Math.round(100*(pair-minimum)/pair));
      divider.setAttribute("aria-valuenow",Math.round(100*widths[index]/pair));
    });
  }
  function resize(index,widths,nextWidth) {
    const pair = widths[index] + widths[index+1];
    const minimum = Math.min(200,pair/2);
    const next = Math.max(minimum,Math.min(pair-minimum,nextWidth));
    const result = widths.slice();
    result[index] = next;
    result[index+1] = pair-next;
    study.style.setProperty("--panel-columns",result.map(width=>`minmax(0,${width}fr)`).join(" 12px "));
    updateValues(result);
  }
  panes.slice(0,-1).forEach((pane,index)=>{
    const divider = node("div",null,"panel-divider");
    divider.tabIndex = 0;
    divider.setAttribute("role","separator");
    divider.setAttribute("aria-orientation","vertical");
    divider.setAttribute("aria-controls",pane.querySelector(".scroller").id);
    const names = panes.slice(index,index+2).map(item=>item.querySelector("h2").textContent);
    divider.setAttribute("aria-label","调整"+names.join("和")+"的宽度");
    divider.title = "拖动调整宽度，双击恢复默认";
    divider.onpointerdown = event => {
      if (event.button !== 0 || divider.hasPointerCapture(event.pointerId)) return;
      const widths = readWidths();
      const start = event.clientX;
      divider.setPointerCapture(event.pointerId);
      divider.classList.add("dragging");
      document.body.classList.add("resizing-panels");
      divider.onpointermove = move => {
        if (move.pointerId === event.pointerId) resize(index,widths,widths[index]+move.clientX-start);
      };
      divider.onlostpointercapture = () => {
        divider.onpointermove = null;
        divider.classList.remove("dragging");
        document.body.classList.remove("resizing-panels");
      };
      event.preventDefault();
    };
    divider.onkeydown = event => {
      const widths = readWidths();
      const targets = {ArrowLeft:widths[index]-24,ArrowRight:widths[index]+24,Home:0,End:Infinity};
      if (!Object.hasOwn(targets,event.key)) return;
      event.preventDefault();
      resize(index,widths,targets[event.key]);
    };
    divider.ondblclick = () => {
      study.style.removeProperty("--panel-columns");
      updateValues(readWidths());
    };
    pane.after(divider);
    dividers.push(divider);
  });
  const observer = new ResizeObserver(()=>updateValues(readWidths()));
  observer.observe(study);
}

    if (packageMode) {
      scroller.addEventListener("scroll",()=>onScroll("lawyer-pane"),{passive:true});
      scroller.addEventListener("toggle",refreshScrollTail,true);
    }
    pane.append(heading,scroller);
    study.append(pane);
  }
  if (packageMode) view.append(header,toolbar,study);
  else view.append(header,status,toolbar,study);
  root.append(view);
  enablePanelResizing(study);
  const resize = new ResizeObserver(refreshScrollTail);
  resize.observe(byId("left"));
  resize.observe(byId("right"));
  if (packageMode) resize.observe(byId("lawyer-pane"));
  const filters = [contract,stance,scope,reviewStatus,changeStatus,search].filter(Boolean);
  for (const input of filters) input.addEventListener(input===search ? "input" : "change",() => {
    if (openEditor) {
      input.value = input.dataset.past || "";
      return setNotice("请先应用或取消当前编辑，再切换筛选。");
    }
    const versionChange = packageMode && input===stance;
    const keepScroll = versionChange || input===changeStatus;
    const anchor = activeSectionId;
    if (keepScroll) {
      for (const role of [...packageDetailPages.keys()]) closePackageDetail(role);
      input.focus({preventScroll:true});
    }
    if (versionChange) setPackageVersionFilter(input.value);
    if (input===contract) {
      if (packageMode) configurePackageContract(contract.value);
      else contractId = contract.value;
    }
    input.dataset.past = input.value;
    selected = "";
    lastUserSide = "left";
    render(keepScroll);
    if (versionChange && input.value) animatePackageFlip(leftSections.has(anchor) ? anchor : leftSections.keys().next().value);
  });
  for (const input of filters) input.dataset.past = input.value;

  render();
}
window.addEventListener("beforeunload",event => {
  if (openEditor || dirty) {
    event.preventDefault();
    event.returnValue = true;
  }
});
if (packageMode) {
  bootPackage();
} else if (isTemplate) {
  const start = node("main",null,"template-start");
  const examples = node("nav");
  examples.setAttribute("aria-label","复核演示");
  const link = node("a","打开完整字段与滚动验收");
  link.href = "../试用材料/完整字段与滚动验收.html";
  examples.append(link);
  start.append(node("h1","合同标注复核"),node("p","当前文件是生成模板。可从验收页完成实习生复核，再保存交接版打开律师三栏。正式复核请打开对应批次的 HTML。"),examples);
  root.append(start);
} else {
  launch();
}
</script>
</body>
</html>
