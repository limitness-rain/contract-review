<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合同标注复核</title>
<style>
:root { color-scheme:light; --ink:#172921; --soft:#4d6156; --line:#dce5dd; --paper:#fff; --ground:#edf2ec; --accent:#246046; --accent-dark:#173f30; --amber:#ffedb0; font:15px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink); }
button,input,select,textarea { font:inherit; color:inherit; }
button,select,input[type=search],input[type=text],textarea { border:1px solid #bdcdc1; border-radius:7px; background:var(--paper); }
button { cursor:pointer; padding:6px 11px; }
button:hover:not(:disabled) { border-color:var(--accent); background:#eff7f0; }
button:disabled { cursor:default; opacity:.5; }
button.primary { border-color:var(--accent-dark); background:var(--accent-dark); color:#fff; }
button.primary:hover:not(:disabled) { background:var(--accent); }
button.danger { color:#91252b; }
select,input[type=search],input[type=text],textarea { padding:5px 8px; min-width:0; }
textarea { width:100%; resize:vertical; display:block; }
:focus-visible { outline:2px solid #1b7754; outline-offset:2px; }
header { background:#f8fbf6; border-bottom:1px solid var(--line); padding:11px 19px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
h1 { margin:0; font-size:clamp(18px, 2vw, 25px); overflow-wrap:anywhere; }
h2,h3,p { margin:0; }
.template-start { max-width:620px; margin:clamp(24px,10vh,96px) auto; padding:24px; background:var(--paper); border:1px solid var(--line); border-radius:9px; }
body:has(.package-start) { min-height:100vh; background:radial-gradient(ellipse at 25% 0,#e2ede2 0,transparent 62%),#f4f6f0; }
.package-start { width:min(100% - 32px,520px); margin:clamp(24px,10vh,96px) auto; border:1px solid #c8d9cb; border-radius:18px; overflow:hidden; box-shadow:0 20px 54px #173f301c; background:var(--paper); }
.package-start-intro { padding:26px 28px 24px; background:linear-gradient(112deg,#173f30,#275c46); color:#fff; }
.package-start-intro h1 { font-size:27px; line-height:1.3; }
.package-start-lead { margin-top:8px; color:#e3eee7; }
.package-start-modes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; padding:16px 28px 0; }
.package-start-modes button[aria-pressed="true"] { color:#173f30; background:#e2eee4; border-color:#9ebaa6; font-weight:700; }
.package-start-view { display:flex; align-items:center; gap:10px; padding:14px 28px 0; font-size:14px; font-weight:650; }
.package-start-view select { flex:1; min-width:0; }
.package-start-field input[type="file"] { border:1px dashed #a8bead; background:#f7faf5; }
.package-start-form { display:grid; gap:12px; padding:23px 28px 28px; }
.package-start-label,.package-start-field > span { font-size:14px; font-weight:650; }
.package-start-file { display:flex; gap:10px; align-items:center; min-width:0; border:1px dashed #a8bead; background:#f7faf5; border-radius:10px; padding:10px 12px; }
.package-start-file button { flex:none; padding:5px 10px; }
.package-start-filename { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--soft); font-size:13px; }
.package-start-preview { display:grid; gap:2px; padding:8px 11px; border-radius:7px; background:#edf5ee; overflow-wrap:anywhere; }
.package-start-field { display:grid; gap:5px; }
.package-start-field input { width:100%; padding:8px 11px; }
.package-start-form > .primary { margin-top:2px; justify-self:stretch; }
.package-start-status { color:#852d34; overflow-wrap:anywhere; }
.package-start-status:empty { display:none; }
.package-card-summary { grid-template-columns:minmax(0,32%) minmax(0,1fr); font-size:13px; }
.package-card-badges { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:4px; margin-left:auto; }
.badge.package-related-clear { color:#195b64; background:#e2f3f2; }
.badge.package-no-attention { color:#43515a; background:#e9eef1; }
.badge.package-change-edited { color:#194878; background:#eaf3ff; }
.badge.package-change-confirmed { color:#315841; background:#e7f2e7; }
.badge.package-change-removed { color:#8a2a32; background:#f9e8e8; }
.package-removed-card { border-color:#e4b9ba; background:#fffafa; }
.package-removal-reason { background:#f9eeee; color:#75292d; border-radius:6px; padding:7px 9px; }
.package-diff-label { display:flex; gap:6px; align-items:center; font-weight:650; }
.package-diff-value { background:#edf5ff; border-left:3px solid #4a84bd; border-radius:4px; padding:6px 9px; }
.package-diff-value details { margin-top:4px; }
[hidden] { display:none !important; }
.package-view > header { padding:5px 12px; gap:4px 8px; }
.package-view > header h1 { font-size:16px; flex:1 1 200px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.package-view > header .header-actions { gap:4px; }
.package-view button,.package-menu > summary { font-size:13px; padding:3px 8px; }
.package-info { flex:1 1 100%; min-width:0; display:flex; align-items:center; gap:4px 11px; }
.package-info > span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.package-info > span:not(.status) { flex-shrink:0; max-width:25%; }
.package-info .status { flex:1 1 8em; min-width:0; min-height:0; padding:0; border:0; background:none; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.package-view > .toolbar { padding:5px 12px; gap:5px 10px; font-size:13px; }
.package-view .toolbar label { gap:4px; }
.package-view .toolbar select,.package-view .toolbar input[type=search] { padding:2px 5px; }
.package-view .toolbar #contract { max-width:min(205px,55vw); }
.package-view .toolbar #stance { max-width:min(160px,45vw); }
.package-view .toolbar #search { width:min(155px,55vw); }
.package-view .pane-heading { min-height:36px; padding:4px 8px; }
.package-view .pane-heading h2 { font-size:14px; }
.package-view .pane-heading .toolbar-line { gap:4px; }
.package-view .pane-heading .small { font-size:11px; white-space:nowrap; }
.package-view .study { padding:7px; }
.package-menu { position:relative; }
.package-menu > summary { list-style:none; white-space:nowrap; color:var(--ink); border:1px solid #bdcdc1; border-radius:7px; background:var(--paper); user-select:none; }
.package-menu > summary::-webkit-details-marker { display:none; }
.package-menu > summary::after { content:" ▾"; }
.package-menu-panel { position:absolute; top:calc(100% + 4px); right:0; z-index:12; min-width:max-content; padding:4px; display:grid; gap:3px; border:1px solid #bdcdc1; border-radius:7px; background:var(--paper); box-shadow:0 4px 14px #17292125; }
.package-menu-panel button { text-align:left; }
.package-review-panel label > span { font-size:13px; }
.package-review-panel .package-review-confirm { width:100%; margin-top:8px; min-height:38px; font-size:14px; font-weight:650; }
.package-clause-actions { margin-top:5px; }
.package-version-option { display:flex; align-items:center; gap:8px; }
.package-version-switch { display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-bottom:8px; }
.package-version-switch span { min-width:0; overflow-wrap:anywhere; margin-right:auto; color:var(--version-ink,#244663); font-weight:650; }
.package-version-switch .package-flip { flex:none; margin-left:auto; border-color:var(--version-ink,#244663); background:var(--version-ink,#244663); color:#fff; font-weight:650; }
.package-version-switch .package-flip:hover:not(:disabled) { background:var(--version-hover,#325b7d); }
.package-list-source { color:var(--version-ink,var(--ink)); overflow-wrap:anywhere; }
.package-validation-issue { margin-top:9px; }
.package-validation-problem { display:grid; justify-items:start; gap:3px; padding:8px 10px; border-left:3px solid #c19b61; background:#faf6ed; border-radius:4px; min-width:0; }
.package-validation-problem > button { margin-top:3px; }
.package-issue-comparison { display:grid; gap:5px; }
.package-issue-snippet { padding:6px 8px; border:1px solid var(--line); border-radius:5px; }
.package-lane-empty { padding:16px 12px; color:var(--soft); font-size:13px; }
.package-sentence-diff { display:grid; gap:7px; }
.package-sentence-diff strong { display:block; font-size:12px; color:var(--accent-dark); }
.package-sentence-diff mark { background:#cce2fc; }
.package-sentence-diff > div:first-child mark { background:#f3d9de; }
.package-detail-page { background:var(--paper); }
.package-detail-nav { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:4px; padding:6px 8px; background:var(--paper); border-bottom:1px solid var(--line); }
.package-detail-back,.package-edit-button { font-weight:600; color:var(--accent-dark); }
.package-detail-content { border:0; margin:0; padding:10px; }
.package-detail-content h3 { overflow-wrap:anywhere; }
.package-detail-nav .package-field-toggle { margin-left:auto; }
.package-edit-form .edit-grid { min-inline-size:0; }
.package-edit-form > .small { margin-bottom:6px; }
.package-fields { grid-template-columns:minmax(0,1fr); }
.package-fields dd { padding-bottom:7px; border-bottom:1px solid var(--line); }
.package-task { display:flex; gap:8px; align-items:start; }
.package-history { margin:16px 0; }
.template-start p { margin-top:8px; }
.template-start nav { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:16px; }
.template-start a { color:var(--accent-dark); }
header .header-actions { margin-left:auto; display:flex; gap:7px; flex-wrap:wrap; }
.status { padding:6px 19px; background:#f8fbf6; border-bottom:1px solid var(--line); color:var(--soft); min-height:38px; overflow-wrap:anywhere; }
.view { height:100vh; height:100dvh; min-height:440px; display:flex; flex-direction:column; }
.toolbar { padding:9px 19px; display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px; background:#f8fbf6; border-bottom:1px solid var(--line); }
.toolbar label { display:flex; align-items:center; gap:6px; max-width:100%; white-space:nowrap; }
.toolbar select { max-width:min(290px,70vw); }
.toolbar input[type=search] { width:min(215px,60vw); }
.study { display:grid; grid-template-columns:var(--panel-columns,minmax(0,1fr) 12px minmax(0,1fr)); padding:11px; min-height:0; flex:1; }
.study.with-lawyer { grid-template-columns:var(--panel-columns,minmax(0,1fr) 12px minmax(0,1fr) 12px minmax(0,.8fr)); }
.panel-divider { cursor:col-resize; touch-action:none; display:grid; place-items:center; border-radius:5px; }
.panel-divider::after { content:""; width:4px; height:36px; border-radius:3px; background:#a8bcad; }
.panel-divider:hover,.panel-divider:focus-visible,.panel-divider.dragging { background:#dce9dd; }
.resizing-panels { cursor:col-resize; user-select:none; }
.lawyer-content { padding:10px; }
.lawyer-content > h3 { margin:12px 0 6px; font-size:15px; }
.lawyer-content > h3:first-child { margin-top:0; }
.discussion-source { overflow-wrap:anywhere; }
.pane { min-height:0; display:flex; flex-direction:column; background:#f8fbf6; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
.pane-heading { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:5px; padding:8px 13px; border-bottom:1px solid var(--line); background:var(--paper); }
.pane-heading h2 { font-size:15px; }
.pane-heading .toolbar-line { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.scroller { flex:1; overflow:auto; overflow-anchor:none; min-height:0; scrollbar-gutter:stable; scroll-padding:12px; }
.doc-section,.row-section { margin:11px; border-radius:7px; }
.doc-section { padding:14px 19px; background:var(--paper); border:1px solid var(--line); }
.doc-section.active,.row-section.active { outline:1px solid #a9c4b1; }
.doc-section h3, .row-section h3 { font-size:15px; margin-bottom:7px; color:var(--accent-dark); }
.doc-text,.wrap { white-space:pre-wrap; overflow-wrap:anywhere; }
.doc-text { tab-size:4; }
.row-section { padding:7px; }
.row-section + .row-section { border-top:1px solid var(--line); }
.row-section > h3 { padding:0 3px; }
.row-section.empty-section > h3 { color:var(--soft); margin-bottom:1px; }
.row-section.empty-section > p { padding-top:1px; padding-bottom:2px; }
.scroll-tail { pointer-events:none; }
.card { background:var(--paper); padding:11px 12px; border:1px solid var(--line); border-radius:8px; margin:0 0 8px; display:grid; gap:8px; }
.card.selected { border-color:var(--accent); }
.package-card-stance { color:var(--version-ink,var(--ink)); font-weight:750; }
.package-edit-form :is(input,textarea)[readonly] { background:#f0f4f0; color:var(--soft); }
[data-contract-version="first"] { --version-paper:#eff6fc; --version-border:#b9d0e4; --version-edge:#658db1; --version-ink:#244663; --version-hover:#325b7d; --version-turn:-48deg; }
[data-contract-version="second"] { --version-paper:#fbf3e5; --version-border:#ddc9a6; --version-edge:#a87c3d; --version-ink:#68461e; --version-hover:#805729; --version-turn:48deg; }
:is(.doc-section,.package-card,.package-detail-content)[data-contract-version] { background:var(--version-paper); border-color:var(--version-border); box-shadow:inset 3px 0 var(--version-edge); }
.package-card[data-contract-version].package-removed-card { border-color:#e4b9ba; }
:is(.doc-section,.row-section)[data-contract-version].active { outline-color:var(--version-edge); }
.package-card[data-contract-version].selected { border-color:var(--version-ink); }
@media (prefers-reduced-motion:no-preference) {
  .package-version-enter { animation:package-version-turn 280ms cubic-bezier(.2,.65,.3,1); }
  @keyframes package-version-turn {
    from { transform:perspective(900px) rotateY(var(--version-turn,-48deg)); opacity:.3; }
    to { transform:perspective(900px) rotateY(0); opacity:1; }
  }
}
.card-head, .row-actions { display:flex; gap:6px 8px; flex-wrap:wrap; align-items:center; }
.card-head > strong { flex:1 0 165px; overflow-wrap:anywhere; }
.badge { background:#e7f2e7; color:#214a35; border-radius:20px; padding:1px 8px; font-size:12px; white-space:nowrap; }
.badge.risk { background:#fce5dd; color:#802b22; }
.badge.empty { background:#ffefc8; color:#674a0e; }
.small,.muted { color:var(--soft); font-size:13px; }
.placeholder { font-size:13px; color:var(--soft); padding:6px 4px; }
.summary-grid { margin:0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:3px 10px; }
.summary-grid dt { color:var(--soft); }
.summary-grid dd { margin:0; }
details > summary { cursor:pointer; color:var(--accent-dark); }
.rule-details { border:1px solid var(--line); border-radius:5px; }
.rule-details > summary { padding:7px 10px; font-weight:600; }
.rule-details[open] > summary { border-bottom:1px solid var(--line); }
.rule-details > p { margin:8px 10px; }
.related-clause { padding:8px 10px; border:1px solid var(--line); border-radius:7px; }
.related-clause h4 { margin:0 0 5px; font-size:inherit; }
.field-empty { color:var(--soft); }
.details-body,.edit-grid { padding-top:7px; }
.field-group { margin-top:8px; padding:8px 0 0; border-top:1px solid var(--line); }
.field-group h3 { margin-bottom:3px; color:var(--accent-dark); font-size:13px; }
fieldset.edit-grid { margin:0; border:1px solid var(--line); border-radius:5px; }
fieldset.edit-grid legend { color:var(--accent-dark); font-size:13px; }
.edit-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.edit-grid label { min-width:0; }
.edit-grid i { display:block; font-style:normal; font-size:13px; }
.edit-grid label > select,.edit-grid label > input { width:100%; }
.full { grid-column:1/-1; }
mark { background:var(--amber); padding:1px 0; color:inherit; }
mark.target { background:#fbc874; }
.review { padding:8px; background:#f4f7f3; border-radius:5px; }
.review label,.review textarea { margin-top:4px; }
.review label { display:block; }
.review .small { margin-top:5px; }
.change { border-left:2px solid #adc5b0; padding:4px 6px; margin:5px 0; }
.change p { margin-top:3px; }
dialog { max-width:min(800px,93vw); max-height:85vh; width:100%; overflow:auto; padding:17px; border:1px solid #a6baa9; border-radius:9px; color:var(--ink); box-shadow:0 8px 45px #17292126; }
dialog::backdrop { background:#17292166; }
dialog ul { padding-left:21px; }
dialog .close { float:right; }
.package-filename-dialog { width: min(520px, 90vw); }
.package-filename-dialog input { width:100%; margin:5px 0 10px; }
@media(max-width:760px) {
  header,.toolbar,.status { padding-left:9px; padding-right:9px; }
  .study { grid-template-columns:1fr; grid-template-rows:minmax(160px,.72fr) minmax(240px,1fr); gap:5px; padding:5px; }
  .view { min-height:600px; }
  .doc-section { padding:8px 10px; }
  .study.with-lawyer { grid-template-columns:1fr; grid-template-rows:minmax(160px,.72fr) minmax(240px,1fr) minmax(240px,1fr); }
  .panel-divider { display:none; }
  .view:has(.with-lawyer) { min-height:820px; }
  .package-info > span:not(.status) { max-width:34%; }
  .package-view .header-actions { margin-left:0; }
}
</style>
</head>

"use strict";

const packageFormat = "contract-review-package";
const packageVersion = 1;
const pairedPackageVersion = 2;
const packagePairs = project=>project.version_pairs ?? (project.version_pair ? [project.version_pair] : []);
const packageSourceFields = ["合同附件名称","立场"];
const packageBoundFields = [...packageSourceFields,"风险名称","风险等级","审查逻辑","条款原文"];
const packageRuleFields = ["风险名称","立场","风险等级","审查逻辑"];
const packageJudgmentLabels = {
  triggered:"标记为触发",clear:"标记为相关未触发",unrelated:"标记为不相关",missingClear:"标记为未触发"
};
const packageJudgmentActions = new Set(["remove","restore","add",...Object.values(packageJudgmentLabels)]);
const packageLimit = 200 * 1024 * 1024;
const packageMember = /^(?:manifest\.json|baseline\.json|activity\/[0-9a-f-]{36}\.json|sources\/\d+\.[a-z0-9]+)$/;
const packageStateKeys = ["stage","review_questions","lawyer_suggestions","lawyer_opinion_required","role_views","review_related"];
const packageRoles = ["student","lawyer"];
const packageStages = [...packageRoles,"final"];
const packageUuid = /^[0-9a-f-]{36}$/;
const utf8 = new TextEncoder();
const fromUtf8 = new TextDecoder("utf-8",{fatal:true});
const packJSON = value=>utf8.encode(JSON.stringify(value));
const unpackJSON = bytes=>JSON.parse(fromUtf8.decode(bytes));
const samePackageValue = (left,right)=>JSON.stringify(left ?? null)===JSON.stringify(right ?? null);
const hexHash = async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)),byte=>byte.toString(16).padStart(2,"0")).join("");
const requirePackage = (condition,message)=>{ if (!condition) throw new Error(message); };

function packageCardType(fields) {
  const relevant = fields?.["条款与规则是否相关"];
  const trigger = fields?.["是否触发该风险"];
  const evidence = fields?.["风险判断关键证据"];
  if (relevant==="是" && trigger==="是") return "related-hit";
  if (relevant==="是" && trigger==="否") return "related-clear";
  if (relevant==="否" && trigger==="是") return "no-clause";
  if (relevant==="否" && trigger==="否" && typeof evidence==="string" && evidence.trim()) return "no-attention";
  return "";
}

function packageUntriggeredCard(fields) {
  const type = packageCardType(fields);
  return type==="related-clear" || type==="no-attention";
}

function missingPackageRuleFields(rows) {
  const missing = new Map();
  for (const row of rows) {
    for (const field of packageRuleFields) {
      if (row.fields[field]?.trim()) continue;
      const issue = missing.get(field);
      if (issue) issue.count++;
      else missing.set(field,{field,count:1,first:row.id});
    }
  }
  return [...missing.values()];
}

function packageSourceRow(id) {
  const match = /^row-(\d+)(?:-表(\d+))?$/.exec(id || "");
  return match ? {number:match[1],workbook:match[2],index:Number(match[2] || 1)-1} : null;
}

function latestPackageJudgment(row,role) {
  return row.review_history?.findLast(entry=>entry && (!role || entry.stage===role) && packageJudgmentActions.has(entry.action));
}
function packageCurrentRemoval(row) {
  return row.fields["是否触发该风险"]==="否" && latestPackageJudgment(row)?.action==="remove";
}
function packageWorkbookSelection(project) {
  if (project.stage!=="final") return {rows:project.rows,removed:0};
  const paired = new Set(packagePairs(project).flatMap(pair=>pair.contracts));
  const rows = project.rows.filter(row=>!(paired.has(row.contract_id) &&
    row.lawyer?.reviewed===true && packageCurrentRemoval(row)));
  return {rows,removed:project.rows.length-rows.length};
}

const crcTable = Uint32Array.from({length:256},(_,index)=>{
  for (let i=0;i<8;i++) index = (index>>>1) ^ (index&1 ? 0xedb88320 : 0);
  return index;
});
function zipCRC(bytes) {
  let crc = 0xffffffff;
  for (const byte of bytes) crc = (crc>>>8) ^ crcTable[(crc ^ byte)&255];
  return (crc ^ 0xffffffff)>>>0;
}
function zipView(length) {
  return new DataView(new ArrayBuffer(length));
}
function makeStoredZip(entries,type="application/zip") {
  const chunks = [], directory = [];
  let offset = 0, directorySize = 0;
  requirePackage(entries.size<=2000,"数据包文件数量超出上限。");
  for (const [name,bytes] of entries) {
    const path = utf8.encode(name);
    const crc = zipCRC(bytes);
    const local = zipView(30);
    const central = zipView(46);
    local.setUint32(0,0x04034b50,true);
    local.setUint16(4,20,true);
    local.setUint16(6,0x800,true);
    local.setUint16(12,33,true);
    local.setUint32(14,crc,true);
    local.setUint32(18,bytes.length,true);
    local.setUint32(22,bytes.length,true);
    local.setUint16(26,path.length,true);
    central.setUint32(0,0x02014b50,true);
    central.setUint16(4,20,true);
    central.setUint16(6,20,true);
    central.setUint16(8,0x800,true);
    central.setUint16(14,33,true);
    central.setUint32(16,crc,true);
    central.setUint32(20,bytes.length,true);
    central.setUint32(24,bytes.length,true);
    central.setUint16(28,path.length,true);
    central.setUint32(42,offset,true);
    chunks.push(local.buffer,path,bytes);
    directory.push(central.buffer,path);
    offset += 30+path.length+bytes.length;
    directorySize += 46+path.length;
  }
  requirePackage(offset+directorySize+22<=packageLimit,"文件超出 200 MiB 支持上限。");
  const end = zipView(22);
  end.setUint32(0,0x06054b50,true);
  end.setUint16(8,entries.size,true);
  end.setUint16(10,entries.size,true);
  end.setUint32(12,directorySize,true);
  end.setUint32(16,offset,true);
  return new Blob([...chunks,...directory,end.buffer],{type});
}
function readStoredZip(buffer) {
  const length = buffer.byteLength;
  requirePackage(length>=22 && length<=packageLimit,"ZIP 不完整或超出 200 MiB。");
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  const u16 = at=>view.getUint16(at,true);
  const u32 = at=>view.getUint32(at,true);
  const end = length-22;
  requirePackage(u32(end)===0x06054b50 && u16(end+4)===0 && u16(end+6)===0 && u16(end+20)===0,"请选择工具生成的复核 ZIP。");
  const count = u16(end+10);
  const start = u32(end+16);
  requirePackage(count<=2000 && u16(end+8)===count && start+u32(end+12)===end,"ZIP 目录无效。");
  let at = start;
  const files = new Map();
  const ranges = [];
  for (let i=0;i<count;i++) {
    requirePackage(at+46<=end && u32(at)===0x02014b50,"ZIP 文件条目不完整。");
    const flags = u16(at+8), size = u32(at+24), crc = u32(at+16);
    requirePackage((flags===0 || flags===0x800) && u16(at+10)===0 && u32(at+20)===size && u16(at+34)===0,"ZIP 压缩方式不受支持，请使用本工具原样导出的 ZIP。");
    const nameLength = u16(at+28);
    const next = at+46+nameLength+u16(at+30)+u16(at+32);
    requirePackage(next<=end,"ZIP 文件名不完整。");
    const name = fromUtf8.decode(bytes.subarray(at+46,at+46+nameLength));
    requirePackage(packageMember.test(name) && !files.has(name),"ZIP 含未知路径或重复文件。");
    const local = u32(at+42);
    requirePackage(local+30<=start && u32(local)===0x04034b50 && u16(local+6)===flags && u16(local+8)===0
      && u32(local+14)===crc && u32(local+18)===size && u32(local+22)===size && u16(local+26)===nameLength,"ZIP 文件信息不一致。");
    const dataStart = local+30+nameLength+u16(local+28);
    requirePackage(dataStart+size<=start && fromUtf8.decode(bytes.subarray(local+30,local+30+nameLength))===name,"ZIP 文件内容不完整。");
    const content = bytes.subarray(dataStart,dataStart+size);
    requirePackage(zipCRC(content)===crc,"ZIP 文件损坏："+name);
    files.set(name,content);
    ranges.push([local,dataStart+size]);
    at = next;
  }
  requirePackage(at===end,"ZIP 文件目录有多余数据。");
  ranges.sort((a,b)=>a[0]-b[0]);
  requirePackage(ranges.every(([offset],i)=>offset===(i ? ranges[i-1][1] : 0)) && ranges.at(-1)?.[1]===start,"ZIP 文件区域重叠或含多余数据。");
  return files;
}

function replayPackage(baseline,events) {
  const project = structuredClone(baseline);
  requirePackage(packageStages.includes(project.stage) && Array.isArray(project.rows) && project.rows.length &&
    samePackageValue(project.fields,packageFieldNames) && Array.isArray(project.contracts) && project.contracts.length &&
    Array.isArray(project.rules),"数据包缺少有效的合同、规则或标注。");
  for (const contract of project.contracts) {
    requirePackage(typeof contract.id==="string" && typeof contract.name==="string" && Array.isArray(contract.sections) &&
      contract.sections.length && contract.sections.every(s=>typeof s.id==="string" && typeof s.text==="string"),"合同切片格式无效。");
  }
  const rows = new Map(project.rows.map(row=>[row.id,row]));
  requirePackage(rows.size===project.rows.length && project.rows.every(row=>typeof row.id==="string" && row.fields),"基线含重复或无效的标注 ID。");
  const ids = new Set();
  for (const [index,event] of events.entries()) {
    requirePackage(event.seq===index+1 && packageUuid.test(event.id) && !ids.has(event.id) && event.role===project.stage &&
      packageRoles.includes(event.role) && typeof event.actor==="string" && event.actor.trim() &&
      Array.isArray(event.rows) && Array.isArray(event.state),"操作编号、顺序或复核角色无效。");
    ids.add(event.id);
    for (const {id,before,after} of event.rows) {
      requirePackage(samePackageValue(rows.get(id),before) && after?.id===id && after.fields,"操作中的标注原值不匹配："+id);
      rows.set(id,structuredClone(after));
    }
    for (const {key,before,after} of event.state) {
      requirePackage(packageStateKeys.includes(key) && samePackageValue(project[key],before),"操作中的交接原值不匹配："+key);
      if (after==null) delete project[key];
      else project[key] = structuredClone(after);
    }
  }
  project.rows = [...rows.values()];
  requirePackage(new Set(project.contracts.map(contract=>contract.id)).size===project.contracts.length &&
    project.contracts.every(contract=>new Set(contract.sections.map(section=>section.id)).size===contract.sections.length
      && (contract.context_blocks == null || Array.isArray(contract.context_blocks))),"合同或切片存在重复 ID 或无效上下文。");
  requirePackage(project.rules.every(rule=>rule && ["id","name","stance","level","logic"].every(key=>typeof rule[key]==="string"))
    && new Set(project.rules.map(rule=>rule.id)).size===project.rules.length,"正式规则结构不完整或 ID 重复。");
  const isFieldMap = fields=>fields && typeof fields==="object" && !Array.isArray(fields)
    && Object.values(fields).every(value=>typeof value==="string");
  requirePackage(project.rows.every(row=>isFieldMap(row.fields) && ["original_fields","submitted_fields"].every(key=>row[key]==null || isFieldMap(row[key]))
    && packageRoles.every(role=>row[role+"_view"]==null || isFieldMap(row[role+"_view"].fields))),"标注字段或角色快照的结构无效。");
  for (const key of ["review_questions","lawyer_suggestions","paths","checks","risk_changes"]) {
    requirePackage(project[key]==null || Array.isArray(project[key]),"复核 JSON 的 "+key+" 应为数组。");
  }
  requirePackage([...(project.review_questions || []),...(project.lawyer_suggestions || [])].every(item=>item && typeof item.text==="string"),"问答或建议格式无效。");
  if (project.version_pairs!=null || project.version_pair) validatePackageVersionPair(baseline,project);
  delete project.shared_rows;
  return project;
}

function validatePackageVersionPair(baseline,project) {
  const pairs = packagePairs(baseline);
  requirePackage(Array.isArray(pairs) && pairs.length &&
    (!baseline.version_pair || (baseline.contracts.length===2 && !baseline.version_pairs)),
    "双版本合同的配对清单无效。");
  const contracts = new Map(baseline.contracts.map(contract=>[contract.id,contract]));
  const used = new Set();
  const initial = new Map(baseline.rows.map(row=>[row.id,row]));
  const current = new Map(project.rows.map(row=>[row.id,row]));
  for (const [index,pair] of pairs.entries()) {
    const ids = pair?.contracts;
    requirePackage(Array.isArray(ids) && ids.length===2 && ids[0]!==ids[1] &&
      ids.every(id=>contracts.has(id) && !used.has(id)),"双版本合同的配对清单无效。");
    ids.forEach(id=>used.add(id));
    const [left,right] = ids.map(id=>contracts.get(id));
    packagePairs(project)[index].shared = validatePackagePair(pair,left,right,initial,current);
  }
  for (const [id,before] of initial) {
    if (!used.has(before.contract_id)) continue;
    const row = current.get(id);
    requirePackage(row.contract_id===before.contract_id && packageSourceFields.every(field=>row.fields[field]===before.fields[field]),
      "双版本标注的来源文件或立场已改变："+id);
  }
}

function validatePackagePair(pair,left,right,initial,current) {
  requirePackage(
    Array.isArray(pair.sections) && Array.isArray(pair.shared),"双版本合同的配对清单无效。");
  const positions = [left,right].map(contract=>new Map(contract.sections.map((section,i)=>[section.id,i])));
  const sectionMap = new Map();
  let previous = [-1,-1];
  for (const ids of pair.sections) {
    requirePackage(Array.isArray(ids) && ids.length===2,"双版本切片配对无效。");
    const indices = positions.map((index,i)=>index.get(ids[i]));
    requirePackage(indices.every((index,i)=>index>previous[i]),"双版本切片配对有重复、无效引用或顺序交叉。");
    previous = indices;
    sectionMap.set(ids[0],ids[1]);
  }
  const seen = new Set();
  const shared = [];
  for (const ids of pair.shared) {
    requirePackage(Array.isArray(ids) && ids.length===2 && ids[0]!==ids[1] && ids.every(id=>!seen.has(id)),
      "共享标注配对有重复或无效引用。");
    const [a,b] = ids.map(id=>initial.get(id));
    requirePackage(a?.contract_id===left.id && b?.contract_id===right.id && a.scope==="slice" && b.scope==="slice" &&
      sectionMap.has(a.section_id) && sectionMap.get(a.section_id)===b.section_id &&
      left.sections[positions[0].get(a.section_id)].text===right.sections[positions[1].get(b.section_id)].text &&
      packageFieldNames.every(field=>packageSourceFields.includes(field) || field==="审查逻辑" || a.fields[field]===b.fields[field]),
      "共享标注与原始合同切片或初标字段不匹配。");
    ids.forEach(id=>seen.add(id));
    // Some earlier packages declared sharing despite different formal logic.
    // Retain both rows and their history, and apply the strict sharing rule on reopen.
    if (a.fields["审查逻辑"]!==b.fields["审查逻辑"]) continue;
    validateSharedReview([a,b],ids.map(id=>current.get(id)));
    shared.push(ids);
  }
  return shared;
}

function validateSharedReview(prior,updated) {
  const [x,y] = updated;
  requirePackage(x && y && packageFieldNames.every(field=>packageSourceFields.includes(field) || x.fields[field]===y.fields[field]) &&
    packageRoles.every(role=>samePackageValue(x[role],y[role])) &&
    packageCurrentRemoval(x)===packageCurrentRemoval(y) &&
    updated.every((row,i)=>["contract_id","rule_id","scope","section_id","matter_id"].every(key=>row[key]===prior[i][key]) &&
      packageBoundFields.every(field=>row.fields[field]===prior[i].fields[field])),"共享标注的复核结果或版本绑定不一致。");
}

async function loadReviewPackage(file) {
  requirePackage(file.size<=packageLimit,"数据包超出 200 MiB。");
  const contents = readStoredZip(await file.arrayBuffer());
  requirePackage(contents.has("manifest.json") && contents.has("baseline.json"),"缺少清单或基线文件。");
  const manifest = unpackJSON(contents.get("manifest.json"));
  requirePackage(manifest.format===packageFormat && [packageVersion,pairedPackageVersion].includes(manifest.version),"不支持的数据包格式或版本。");
  requirePackage(packageUuid.test(manifest.package_id) && typeof manifest.batch_id==="string" && Array.isArray(manifest.parents)
    && manifest.parents.every(value=>packageUuid.test(value)) && Number.isInteger(manifest.revision) && manifest.revision>=0
    && Number.isInteger(manifest.round) && manifest.round>=1 && Array.isArray(manifest.sources),"包编号、轮次或来源信息无效。");
  contents.delete("manifest.json");
  const checks = Object.entries(manifest.files);
  requirePackage(checks.length===contents.size && checks.every(([name])=>contents.has(name)),"ZIP 内容与清单不一致。");
  await Promise.all(checks.map(async ([name,hash])=>{
    requirePackage(await hexHash(contents.get(name))===hash,"文件校验失败："+name);
  }));
  requirePackage(manifest.files["baseline.json"]===manifest.baseline_sha256,"基线校验失败。");
  const events = [], sourceEntries = new Set();
  for (const source of manifest.sources) {
    requirePackage(source.entry?.startsWith("sources/") && !sourceEntries.has(source.entry) &&
      manifest.files[source.entry]===source.sha256 && typeof source.name==="string" && typeof source.purpose==="string","源文件清单无效。");
    sourceEntries.add(source.entry);
  }
  for (const [name,bytes] of contents) {
    if (name.startsWith("sources/")) requirePackage(sourceEntries.has(name),"源文件缺少用途说明。");
    if (name.startsWith("activity/")) {
      const actorId = name.slice(9,-5);
      const group = unpackJSON(bytes);
      requirePackage(Array.isArray(group) && group.every(event=>event.actor_id===actorId),"人员日志与文件名不一致。");
      events.push(...group);
    }
  }
  events.sort((a,b)=>a.seq-b.seq);
  const baseline = unpackJSON(contents.get("baseline.json"));
  requirePackage(!!(baseline.version_pair || baseline.version_pairs)===(manifest.version===pairedPackageVersion),"双版本配对清单与数据包版本不一致。");
  const project = replayPackage(baseline,events);

function workbookForProject(project) {

"use strict";

// Office files use compressed ZIP entries. The review ZIP codec stays stored-only.
function openOfficeArchive(buffer) {
  const bytes = new Uint8Array(buffer), view = new DataView(buffer);
  const u16 = offset=>view.getUint16(offset,true);
  const u32 = offset=>view.getUint32(offset,true);
  let end = buffer.byteLength-22;
  const earliest = Math.max(0,end-65535);
  while (end>=earliest && (u32(end)!==0x06054b50 || end+22+u16(end+20)!==bytes.length)) end--;
  requirePackage(end>=earliest && !u16(end+4) && !u16(end+6) && u16(end+8)===u16(end+10),
    "无法读取 Office 文件。请检查文件是否损坏或带有密码。");
  const count = u16(end+10), directory = u32(end+16);
  requirePackage(count<=10000 && directory+u32(end+12)===end,"Office 文件目录无效。");
  const entries = new Map();
  let pos = directory, totalRead = 0;
  for (let i=0;i<count;i++) {
    requirePackage(pos+46<=end && u32(pos)===0x02014b50,"Office 文件目录无效。");
    const nameEnd = pos+46+u16(pos+28);
    const next = nameEnd+u16(pos+30)+u16(pos+32);
    requirePackage(next<=end,"Office 文件目录无效。");
    const path = fromUtf8.decode(bytes.subarray(pos+46,nameEnd));
    requirePackage(!entries.has(path),"Office 文件包含重复的内部部件。");
    entries.set(path,{flags:u16(pos+8),method:u16(pos+10),crc:u32(pos+16),
      packed:u32(pos+20),size:u32(pos+24),local:u32(pos+42)});
    pos = next;
  }
  requirePackage(pos===end,"Office 文件目录长度无效。");
  return {
    has:path=>entries.has(path),
    async xml(path) {
      const item = entries.get(path);
      requirePackage(item && !(item.flags&1) && [0,8].includes(item.method),"缺少或无法读取内部部件 "+path+"。");
      requirePackage(item.size<=64*1024*1024 && totalRead+item.size<=packageLimit,"Office 文档正文或工作表过大。");
      totalRead += item.size;
      const local = item.local;
      requirePackage(local+30<=directory && u32(local)===0x04034b50 && u16(local+8)===item.method,
        "Office 文件部件无效。");
      const start = local+30+u16(local+26)+u16(local+28);
      requirePackage(start+item.packed<=directory,"Office 文件部件长度无效。");
      let data = bytes.subarray(start,start+item.packed);
      if (item.method===8) {
        let inflate;
        try {
          inflate = new DecompressionStream("deflate-raw");
        } catch {
          throw new Error("当前浏览器无法解压 Office 文件，请使用新版 Chrome 或 Edge。");
        }
        const reader = new Blob([data]).stream().pipeThrough(inflate).getReader();
        data = new Uint8Array(item.size);
        let offset = 0;
        while (true) {
          const {value,done} = await reader.read();
          if (done) break;
          if (offset+value.length>data.length) {
            await reader.cancel();
            throw new Error("Office 文件部件解压长度无效。");
          }
          data.set(value,offset);
          offset += value.length;
        }
        requirePackage(offset===item.size,"Office 文件部件解压长度无效。");
      }
      requirePackage(data.length===item.size && zipCRC(data)===item.crc,"Office 文件部件校验失败。");
      const xml = fromUtf8.decode(data);
      requirePackage(!/<!DOCTYPE/i.test(xml),"Office 文档含不受支持的 XML 定义。");
      const doc = new DOMParser().parseFromString(xml,"application/xml");
      requirePackage(!doc.getElementsByTagNameNS("*","parsererror").length,"Office 文件 XML 无法读取。");
      return doc.documentElement;
    }
  };
}

const officeChildren = (element,tag)=>Array.from(element?.children || []).filter(child=>child.localName===tag);
const officeChild = (element,tag)=>officeChildren(element,tag)[0];
const officeText = (element,tag)=>Array.from(element?.getElementsByTagNameNS("*",tag) || [],part=>part.textContent).join("");
const officeLF = value=>value.replace(/\r\n?/g,"\n");
const officeCompact = value=>value.replace(/[\s\u2028]+/gu,"");
const intakeFileName = value=>value.normalize("NFC");

const wordAttr = (element,key)=>element?.getAttributeNS(element.namespaceURI,key);
const wordValue = (element,tag)=>wordAttr(officeChild(element,tag),"val");

function wordNumberText(number,format) {
  if (format==="decimalZero") return String(number).padStart(2,"0");
  if (format==="decimalFullWidth" || format==="decimalFullWidth2") {
    return String(number).replace(/[0-9]/g,digit=>"０１２３４５６７８９"[Number(digit)]);
  }
  if (["chineseCounting","chineseCountingThousand"].includes(format) &&
      Number.isInteger(number) && number>=0 && number<10000) {
    const digits = "零一二三四五六七八九";
    if (number<10) return digits[number];
    let text = "", zero = false;
    for (const [place,unit] of [[1000,"千"],[100,"百"],[10,"十"],[1,""]]) {
      const digit = Math.floor(number/place)%10;
      if (!digit) { zero = Boolean(text); continue; }
      if (zero) text += digits[0];
      if (digit!==1 || place!==10 || text) text += digits[digit];
      text += unit;
      zero = false;
    }
    return text;
  }
  if (format==="lowerLetter" || format==="upperLetter") {
    const letter = String.fromCharCode((format==="lowerLetter"?97:65)+(number-1)%26);
    if (number>0 && number<=2600) return letter.repeat(Math.ceil(number/26));
  }
  if (format==="decimal" || format==="decimalHalfWidth" || !format) return String(number);
  return "";
}
function wordNumbering(definition) {
  const abstracts = new Map(officeChildren(definition,"abstractNum").map(element=>[wordAttr(element,"abstractNumId"),element]));
  const lists = new Map();
  for (const num of officeChildren(definition,"num")) {
    const abstract = abstracts.get(wordValue(num,"abstractNumId"));
    const levels = new Map(officeChildren(abstract,"lvl").map(level=>[Number(wordAttr(level,"ilvl")),{level}]));
    for (const override of officeChildren(num,"lvlOverride")) {
      const index = Number(wordAttr(override,"ilvl"));
      const level = officeChild(override,"lvl") || levels.get(index)?.level;
      if (level) levels.set(index,{level,start:wordValue(override,"startOverride")});
    }
    lists.set(wordAttr(num,"numId"),{levels,active:new Map()});
  }
  return paragraph=>{
    const props = officeChild(officeChild(paragraph,"pPr"),"numPr");
    const list = lists.get(wordValue(props,"numId"));
    const index = Number(wordValue(props,"ilvl") || 0);
    const entry = list?.levels.get(index);
    if (!entry) return "";
    const {levels,active} = list;
    const start = number=>Number(levels.get(number)?.start ?? wordValue(levels.get(number)?.level,"start") ?? 1);
    active.set(index,(active.get(index) ?? start(index)-1)+1);
    for (const sub of active.keys()) {
      const restart = wordValue(levels.get(sub).level,"lvlRestart");
      if (sub>index && restart!=="0" && index<Number(restart || sub)) active.delete(sub);
    }
    const template = wordValue(entry.level,"lvlText") || "";
    const format = wordValue(entry.level,"numFmt");
    if (!template || format==="bullet" || format==="none") return "";
    let supported = true;
    const label = template.replace(/%([1-9])/g,(_,digit)=>{
      const level = Number(digit)-1;
      const text = wordNumberText(active.get(level) ?? start(level),wordValue(levels.get(level)?.level,"numFmt"));
      if (!text) supported = false;
      return text;
    });
    if (!supported) return "";
    const suffix = wordValue(entry.level,"suff");
    return label+(suffix==="nothing"?"":suffix==="space"?" ":"\t");
  };
}

function wordBodyBlocks(container,numberLabel,keepEmpty=false) {
  const result = [];
  for (const item of container.children) {
    const tag = item.localName;
    if (tag==="p" || tag==="tbl") {
      const body = tag==="p" ? wordParagraphText(item) : wordTableText(item,numberLabel);
      const text = tag==="p" && body.trim() ? numberLabel(item)+body : body;
      if (keepEmpty || text.trim()) result.push({kind:tag==="p"?"paragraph":"table",text});
    } else if (["sdt","sdtContent","customXml","ins"].includes(tag)) {
      result.push(...wordBodyBlocks(item,numberLabel,keepEmpty));
    }
  }
  return result;
}
function wordParagraphText(element) {
  const separators = {tab:"\t",br:"\n",cr:"\n",noBreakHyphen:"\u2011"};
  const parts = [];
  function read(item) {
    const tag = item.localName;
    if (["del","delText","instrText","txbxContent"].includes(tag)) return;
    if (tag==="t") parts.push(item.textContent);
    else if (Object.hasOwn(separators,tag)) parts.push(separators[tag]);
    else for (const child of item.children) read(child);
  }
  read(element);
  return parts.join("");
}
function wordTableText(table,numberLabel) {
  return officeChildren(table,"tr").map(row=>{
    const values = [];
    for (const cell of officeChildren(row,"tc")) {
      values.push(wordBodyBlocks(cell,numberLabel,true).map(block=>block.text).join("\u2028"));
      const span = officeChild(officeChild(cell,"tcPr"),"gridSpan");
      const width = Number(span?.getAttributeNS(span.namespaceURI,"val"));
      if (Number.isInteger(width) && width>1) values.push(...Array(Math.min(width-1,100)).fill(""));
    }
    return values.join("\t");
  }).join("\n");
}
async function readIntakeWord(archive) {
  const document = await archive.xml("word/document.xml");
  const body = officeChild(document,"body");
  const definition = archive.has("word/numbering.xml") ? await archive.xml("word/numbering.xml") : null;
  const blocks = body ? wordBodyBlocks(body,wordNumbering(definition)) : [];
  requirePackage(blocks.length,"未找到可读取的 Word 正文。请上传有可选中文字的 .docx。");
  return blocks;
}

async function readIntakeWorkbook(archive) {
  const workbook = await archive.xml("xl/workbook.xml");
  const sheets = officeChildren(officeChild(workbook,"sheets"),"sheet");
  const named = sheets.filter(sheet=>sheet.getAttribute("name")==="标注集");
  const sheet = named.length===1 ? named[0] : sheets.length===1 ? sheets[0] : null;
  requirePackage(sheet,"请在 Excel 中保留一个名为「标注集」的工作表。");
  const relId = Array.from(sheet.attributes).find(attr=>attr.localName==="id")?.value;
  const rels = await archive.xml("xl/_rels/workbook.xml.rels");
  const relation = officeChildren(rels,"Relationship").find(item=>item.getAttribute("Id")===relId);
  const target = relation?.getAttribute("Target");
  requirePackage(target && relation.getAttribute("TargetMode")!=="External" && /^[\w./-]+$/.test(target)
    && !target.split("/").includes(".."),"无法定位 Excel 的标注工作表。");
  const data = officeChild(await archive.xml(target.startsWith("/")?target.slice(1):"xl/"+target),"sheetData");
  const shared = archive.has("xl/sharedStrings.xml")
    ? officeChildren(await archive.xml("xl/sharedStrings.xml"),"si").map(item=>officeText(item,"t"))
    : [];
  let columns;
  const rows = [];
  for (const row of officeChildren(data,"row")) {
    const rowNumber = row.getAttribute("r");
    requirePackage(/^\d+$/.test(rowNumber || ""),"Excel 包含无法定位的标注行。");
    const cells = new Map();
    for (const cell of officeChildren(row,"c")) {
      const address = cell.getAttribute("r") || "";
      const column = /^([A-Z]+)\d+$/.exec(address)?.[1];
      requirePackage(column && !cells.has(column),"标注集第 "+rowNumber+" 行含无效或重复的单元格。");
      if (columns && !columns.includes(column)) continue;
      const kind = cell.getAttribute("t");
      let value = officeChild(cell,"v")?.textContent || "";
      requirePackage(!officeChild(cell,"f") && kind!=="e","单元格 "+address+" 含公式或错误值，请改为文本。");
      if (kind==="s") {
        requirePackage(/^\d+$/.test(value) && Number(value)<shared.length,"单元格 "+address+" 的共享文本无效。");
        value = shared[Number(value)];
      } else if (kind==="inlineStr") value = officeText(cell,"t");
      cells.set(column,officeLF(value.replace(/_x([0-9a-f]{4})_/gi,(_,hex)=>String.fromCharCode(parseInt(hex,16)))));
    }
    if (![...cells.values()].some(value=>value.trim())) continue;
    if (!columns) {
      const header = [...cells];
      const missing = packageFieldNames.filter(field=>header.filter(([,value])=>value.trim()===field).length!==1);
      requirePackage(!missing.length,"Excel 缺少以下标注字段或存在同名列："+missing.join("、")+"。");
      columns = packageFieldNames.map(field=>header.find(([,value])=>value.trim()===field)[0]);
      continue;
    }
    rows.push({id:"row-"+rowNumber,fields:Object.fromEntries(packageFieldNames.map((field,index)=>[field,cells.get(columns[index]) || ""]))});
  }
  requirePackage(rows.length,"Excel 中没有可用的标注行。");
  requirePackage(new Set(rows.map(row=>row.id)).size===rows.length,"Excel 中存在重复的行号。");
  return {rows,sheet:sheet.getAttribute("name"),columns:Object.fromEntries(packageFieldNames.map((field,index)=>[field,columns[index]]))};
}

// Match complete clauses at Word paragraph/table boundaries in document order.
function locateIntakeSections(contract,clauses) {
  const offsets = [0];
  const text = contract.blocks.map(block=>{
    const value = officeCompact(block.text);
    offsets.push(offsets.at(-1)+value.length);
    return value;
  }).join("");
  const boundaries = new Map(offsets.map((offset,index)=>[offset,index]));
  const spans = [];
  for (const [clause,rowId] of clauses) {
    const needle = officeCompact(clause);
    const matches = [];
    for (let at=text.indexOf(needle);at!==-1;at=text.indexOf(needle,at+1)) {
      if (boundaries.has(at) && boundaries.has(at+needle.length)) {
        matches.push([boundaries.get(at),boundaries.get(at+needle.length)]);
        if (matches.length===2) break;
      }
    }
    requirePackage(matches.length===1,
      "标注集第 "+rowId.slice(4)+" 行的「条款原文」"+(matches.length?"在 Word 中有多处相同内容":"无法与 Word 中的完整段落对应")+"。请核对合同版本和切片："+clause.trim().slice(0,45));
    spans.push({start:matches[0][0],end:matches[0][1],clause,rowId});
  }
  spans.sort((a,b)=>a.start-b.start);
  const ids = new Map();
  const sections = [];
  function addSection(start,end,text) {
    const heading = contract.blocks[start].text.trim().split("\n")[0].slice(0,90);
    const id = "S"+String(sections.length+1).padStart(3,"0");
    sections.push({id,heading,text:text ?? contract.blocks.slice(start,end).map(block=>block.text).join("\n")});
    return id;
  }
  let cursor = 0;
  for (const {start,end,clause,rowId} of spans) {
    requirePackage(start>=cursor,"标注集第 "+rowId.slice(4)+" 行的条款切片与其他行重叠。请统一这些行的完整条款原文。");
    if (start>cursor) addSection(cursor,start);
    ids.set(clause,addSection(start,end,clause));
    cursor = end;
  }
  if (cursor<contract.blocks.length) addSection(cursor,contract.blocks.length);
  contract.sections = sections;
  return ids;
}

function alignIntakeVersions(left,right) {
  const heading = section=>officeCompact(section.heading).normalize("NFKC");
  const number = section=>heading(section).match(/^(?:第[一二三四五六七八九十百零〇两\d]+条|[一二三四五六七八九十百零〇两\d]+、|\d+\.(?!\d))/)?.[0] || "";
  const title = section=>heading(section).slice(number(section).length);
  function orderedMatches(first,second,key) {
    function unique(sections) {
      const index = new Map();
      for (const [i,section] of sections.entries()) {
        const value = key(section);
        if (value) index.set(value,index.has(value) ? -1 : i);
      }
      return index;
    }
    const a = unique(first), b = unique(second);
    const candidates = [...a].flatMap(([value,i])=>i>=0 && b.get(value)>=0 ? [[i,b.get(value)]] : []);
    let firstLater = Infinity;
    const later = [];
    for (let i=candidates.length-1;i>=0;i--) {
      later[i] = firstLater;
      firstLater = Math.min(firstLater,candidates[i][1]);
    }
    let lastEarlier = -1;
    return candidates.filter(([,j],i)=>{
      const ordered = j>lastEarlier && j<later[i];
      lastEarlier = Math.max(lastEarlier,j);
      return ordered;
    });
  }
  const a = left.sections, b = right.sections;
  const pairs = [];
  let fromA = 0, fromB = 0;
  for (const [i,j] of [...orderedMatches(a,b,title),[a.length,b.length]]) {
    if (i-fromA===j-fromB) {
      for (const [x,y] of orderedMatches(a.slice(fromA,i),b.slice(fromB,j),number)) {
        pairs.push([a[fromA+x].id,b[fromB+y].id]);
      }
    }
    if (i<a.length) pairs.push([a[i].id,b[j].id]);
    fromA = i+1;
    fromB = j+1;
  }
  return pairs;
}

function matchIntakeSharedRows(group,other) {
  const comparable = row=>JSON.stringify(packageFieldNames.filter(field=>!packageSourceFields.includes(field))
    .map(field=>row.fields[field]));
  const byFields = new Map(other.map(row=>[comparable(row),row.id]));
  const signatures = group.map(comparable);
  if (group.length!==other.length || byFields.size!==other.length ||
      new Set(signatures).size!==group.length || !signatures.every(signature=>byFields.has(signature))) return [];
  return group.map((row,i)=>[row.id,byFields.get(signatures[i])]);
}

function intakeVersionPair(contracts,rows) {
  const [left,right] = contracts;
  const sections = alignIntakeVersions(left,right);
  const sectionMap = new Map(sections);
  const leftText = new Map(left.sections.map(section=>[section.id,section.text]));
  const rightText = new Map(right.sections.map(section=>[section.id,section.text]));
  const ruleGroups = new Map();
  for (const row of rows) {
    if (row.scope!=="slice" || packageRuleFields.some(field=>!row.fields[field].trim())) continue;
    const leftVersion = row.contract_id===left.id;
    const section = leftVersion ? sectionMap.get(row.section_id) : row.section_id;
    if (!section || (leftVersion && leftText.get(row.section_id)!==rightText.get(section))) continue;
    const key = JSON.stringify([section,row.fields["风险名称"],row.fields["风险等级"],row.fields["审查逻辑"],row.matter_id || ""]);
    if (!ruleGroups.has(key)) ruleGroups.set(key,[new Map(),new Map()]);
    const groups = ruleGroups.get(key)[leftVersion ? 0 : 1];
    if (!groups.has(row.rule_id)) groups.set(row.rule_id,[]);
    groups.get(row.rule_id).push(row);
  }
  const shared = [];
  for (const [first,second] of ruleGroups.values()) {
    // Pair complete judgment groups so an association split cannot be shared only in part.
    for (const group of first.values()) {
      const other = second.get(group[0].rule_id) || (first.size===1 && second.size===1 ? second.values().next().value : null);
      if (!other) continue;
      shared.push(...matchIntakeSharedRows(group,other));
    }
  }
  return {contracts:[left.id,right.id],sections,shared};
}

function detectIntakeVersionPairs(contracts,rows) {
  const stances = new Map(contracts.map(contract=>[contract.id,new Set()]));
  for (const row of rows) {
    const stance = row.fields["立场"].trim();
    if (stance) stances.get(row.contract_id).add(stance);
  }
  const groups = new Map();
  for (const contract of contracts) {
    const [stance] = stances.get(contract.id);
    if (stances.get(contract.id).size!==1) continue;
    const stem = contract.name.normalize("NFC").replace(/\.docx$/i,"");
    const suffix = stance.normalize("NFC").replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?:版|立场版)?";
    const base = stem.replace(new RegExp("(?:[ _·－—-]+"+suffix+"|[（(【]"+suffix+"[）)】])$","u"),"").trim();
    if (!base || base===stem) continue;
    if (!groups.has(base)) groups.set(base,[]);
    groups.get(base).push({contract,stance});
  }
  return [...groups.values()].flatMap(group=>{
    if (group.length!==2 || group[0].stance===group[1].stance) return [];
    const versions = group.map(item=>item.contract);
    const pair = intakeVersionPair(versions,rows.filter(row=>versions.some(contract=>contract.id===row.contract_id)));
    return pair.sections.length ? [pair] : [];
  });
}

async function generateInitialPackage(wordFiles,excelFiles,confirmWarnings) {
  requirePackage(wordFiles.length && wordFiles.every(file=>/\.docx$/i.test(file.name)) &&
    excelFiles.length && excelFiles.every(file=>/\.xlsx$/i.test(file.name)),"请选择用于 AI 标注的合同 .docx 和标注集 .xlsx。");
  requirePackage(excelFiles.length===1,"请上传一份统一标注集。");
  requirePackage([...wordFiles,...excelFiles].reduce((sum,file)=>sum+file.size,0)<packageLimit,"所选文件合计超出 200 MiB。");
  const contents = new Map(), sources = [];
  const contracts = new Map(), rules = new Map();
  async function ingest(file,purpose,read) {
    try {
      const buffer = await file.arrayBuffer();
      const value = await read(openOfficeArchive(buffer));
      const entry = "sources/"+(sources.length+1)+file.name.slice(-5).toLowerCase();
      const sha256 = await hexHash(buffer);
      sources.push({entry,name:file.name,purpose,sha256});
      contents.set(entry,new Uint8Array(buffer));
      return {value,sha256};
    } catch (error) {
      throw new Error(file.name+"："+error.message);
    }
  }

  const rows = [], annotationSources = [];
  for (const [index,file] of excelFiles.entries()) {
    const {value:{rows:records,sheet,columns}} = await ingest(file,"AI 初标标注集",readIntakeWorkbook);
    annotationSources.push({name:file.name,sheet,columns});
    for (const row of records) {
      if (excelFiles.length>1) row.id += "-表"+(index+1);
      rows.push(row);
    }
  }
  for (const file of wordFiles) {
    const key = intakeFileName(file.name);
    requirePackage(!contracts.has(key),"合同文件名重复："+file.name);
    const {value:blocks,sha256} = await ingest(file,"用于 AI 标注的合同 Word",readIntakeWord);
    contracts.set(key,{id:"C"+(contracts.size+1),name:null,filename:file.name,blocks,source_sha256:sha256});
  }
  const clauses = new Map([...contracts.values()].map(contract=>[contract.id,new Map()]));
  const [fileKey,categoryKey,clauseKey,riskKey,stanceKey,relevantKey,triggerKey,levelKey,logicKey,,,,evidenceKey] = packageFieldNames;
  for (const row of rows) {
    const f = row.fields;
    const where = "标注集第 "+row.id.slice(4)+" 行";
    const contract = contracts.get(intakeFileName(f[fileKey]));
    requirePackage(contract,where+"需要合同「"+f[fileKey]+"」。请上传 AI 标注实际使用的同名 Word。");
    requirePackage(!contract.name || contract.name===f[fileKey],where+"的合同附件名称写法与其他行不一致。");
    contract.name = f[fileKey];
    requirePackage([relevantKey,triggerKey].every(key=>["是","否"].includes(f[key])),where+"的相关性和触发判断须填「是」或「否」。");
    row.contract_id = contract.id;
    row.rule_id = "";
    if (f[riskKey].trim() && f[stanceKey].trim()) {
      const ruleKey = JSON.stringify([f[riskKey],f[stanceKey]]);
      if (!rules.has(ruleKey)) rules.set(ruleKey,{id:"R"+(rules.size+1),name:f[riskKey],stance:f[stanceKey],level:"",logic:""});
      const rule = rules.get(ruleKey);
      for (const [key,field] of [["level",levelKey],["logic",logicKey]]) {
        if (!f[field].trim()) continue;
        requirePackage(!rule[key] || rule[key]===f[field],where+"的同名同立场规则在不同标注行的等级或审查逻辑不一致："+rule.name+"／"+rule.stance);
        rule[key] = f[field];
      }
      row.rule_id = rule.id;
    }
    row.original_fields = {...f};
    if (f[clauseKey].trim()) {
      row.scope = "slice";
      const selected = clauses.get(contract.id);
      if (!selected.has(f[clauseKey])) selected.set(f[clauseKey],row.id);
    } else {
      requirePackage(f[clauseKey]==="" && !f[categoryKey] && f[relevantKey]==="否" &&
        (!f[evidenceKey].trim() || packageCardType(f)==="no-attention"),
        where+"缺少主条款原文。合同级标注的相关性须为「否」，条款类型留空；有证据的未触发记录显示为「无需关注」。");
      row.scope = "full_missing";
    }
  }
  const sectionByContract = new Map();
  for (const contract of contracts.values()) {
    contract.name ||= contract.filename;
    delete contract.filename;
    sectionByContract.set(contract.id,locateIntakeSections(contract,clauses.get(contract.id)));
  }
  for (const row of rows) {
    if (row.scope==="slice") row.section_id = sectionByContract.get(row.contract_id).get(row.fields[clauseKey]);
  }
  const first = contracts.values().next().value;
  const title = first.name.replace(/\.docx$/i,"")+(contracts.size>1?" 等 "+contracts.size+" 份合同":"");
  const project = {
    title,stage:"student",fields:[...packageFieldNames],contracts:[...contracts.values()],rules:[...rules.values()],rows,
    checks:[{check:"建包来源",message:"规则字段取自上传的 Excel。未提供独立规则库或覆盖清单，漏标需对照合同和正式规则另行核查。",blocking:false}]
  };
  const pairs = detectIntakeVersionPairs(project.contracts,rows);
  if (pairs.length) project.version_pairs = pairs;
  const warnings = missingPackageRuleFields(rows);
  if (warnings.length && !await confirmWarnings(warnings,annotationSources)) return null;
  const baseline = packJSON(project);
  const baselineHash = await hexHash(baseline);
  contents.set("baseline.json",baseline);
  const manifest = {
    format:packageFormat,version:pairs.length ? pairedPackageVersion : packageVersion,batch_id:baselineHash.slice(0,20),package_id:crypto.randomUUID(),
    parents:[],revision:0,round:1,stage:"student",baseline_sha256:baselineHash,sources,annotation_sources:annotationSources,
    handoff:{action:"网页生成初始包",source:excelFiles.map(file=>file.name).join("、"),at:new Date().toISOString()}
  };
  const zip = await exportReviewPackage({contents},manifest,[]);
  const counts = new Map();
  for (const {fields} of rows) {
    const type = packageCardType(fields);
    counts.set(type,(counts.get(type) || 0)+1);
  }
  const shared = pairs.flatMap(pair=>pair.shared);
  const pairedRows = new Set(shared.map(([,id])=>id));
  const sharedReviews = rows.filter(row=>pairedRows.has(row.id) && packageCardType(row.fields)).length;
  return {zip,title,total:rows.length,counts,sharedReviews,
    pairedContracts:pairs.length};
}

  ["related-hit","相关触发"],["related-clear","相关未触发"],
  ["no-clause","全文缺失风险"],["no-attention","无需关注"]
]);

function acceptPackageVersion(incoming) {
  const previous = seenPackageHeads.get(incoming.manifest.baseline_sha256);
  const next = incoming.manifest;
  return !previous || previous.package_id===next.package_id || next.parents.includes(previous.package_id)
    || window.confirm("这个包可能是旧版本或另一条交接分支。请核对文件来源。仍要打开吗？");
}
function actorForPackage(incoming,name) {
  const role = incoming.project.stage;
  if (role==="final") return null;
  const prior = incoming.events.findLast(event=>event.actor===name && event.role===role);
  return {id:prior?.actor_id || crypto.randomUUID(),name};
}
function confirmPackageWarnings(warnings,sources,action) {
  const title = "标注字段有空值";
  const dialog = dialogBox(title);
  dialog.setAttribute("aria-label",title);
  dialog.append(node("p","以下字段缺少值。可以继续，现有空值会保留。"));
  const list = node("ul");
  for (const {field,count,first} of warnings) {
    const row = packageSourceRow(first);
    const source = row && sources?.[row.index];
    const column = source?.columns?.[field];
    const location = typeof source?.sheet==="string" && /^[A-Z]+$/.test(column || "") ?
      "首个空值："+[source.name,"「"+source.sheet+"」!"+column+row.number].filter(Boolean).join(" · ") :
      "首条受影响记录："+(sourceRowLabel(first) || first)+"（包内未记录源单元格）";
    list.append(node("li",field+"缺失 "+count+" 条。"+location));
  }
  dialog.append(list);
  return new Promise(resolve=>{
    let confirmed = false;
    const cancel = button("取消",()=>dialog.close());
    const actions = node("div",null,"row-actions");
    actions.append(cancel,button(action,()=>{
      confirmed = true;
      dialog.close();
    },"primary"));
    dialog.append(actions);
    dialog.addEventListener("close",()=>resolve(confirmed),{once:true});
    cancel.focus();
  });
}
async function confirmPackageImport(incoming) {
  const warnings = missingPackageRuleFields(incoming.project.rows);
  if (!warnings.length) return true;
  let sources = incoming.manifest.annotation_sources;
  if (!Array.isArray(sources)) {
    // Older browser-generated packages kept the original workbooks but no column map.
    const files = incoming.manifest.sources.filter(source=>source.purpose==="AI 初标标注集" && source.entry.endsWith(".xlsx"));
    sources = await Promise.all(files.map(async source=>{
      try {
        const bytes = incoming.contents.get(source.entry);
        const {sheet,columns} = await readIntakeWorkbook(openOfficeArchive(bytes.slice().buffer));
        return {name:source.name,sheet,columns};
      } catch {
        return null;
      }
    }));
  }
  return confirmPackageWarnings(warnings,sources,"仍然进入");
}

function bootPackage(message="导入已有 ZIP，或用合同和 AI 标注集生成初始包。") {

  open.type = "submit";

  function updateOpen() {
    open.disabled = !incoming || (incoming.project.stage!=="final" && !name.value.trim());
  }
  name.oninput = updateOpen;
  async function inspect(file,alreadyConfirmed=false) {
    const attempt = ++importAttempt;
    incoming = null;
    preview.hidden = true;
    identity.hidden = false;
    fileName.textContent = file.name;
    fileName.title = file.name;
    status.textContent = "正在校验数据包…";
    updateOpen();
    try {
      const loaded = await loadReviewPackage(file);
      if (attempt!==importAttempt) return;
      incoming = loaded;
      confirmedDuringBuild = alreadyConfirmed;
      const {stage,round,revision} = loaded.manifest;
      preview.replaceChildren(node("strong",loaded.project.title || "合同复核"),
        node("span",stageNames[stage]+" · 第 "+round+" 轮 · 包版本 "+revision,"small"));
      preview.hidden = false;

    }
  }
  input.onchange = ()=>{
    const file = input.files[0];
    input.value = "";

  form.onsubmit = async event=>{
    event.preventDefault();
    if (!incoming || open.disabled || !acceptPackageVersion(incoming)) return;
    const candidate = incoming;
    if (!confirmedDuringBuild) {
      open.disabled = true;
      const confirmed = await confirmPackageImport(candidate);
      if (incoming!==candidate) return;
      updateOpen();
      if (!confirmed) return;
    }
    mountPackage(candidate,actorForPackage(candidate,name.value.trim()));

  form.append(zipLabel,fileRow,preview,identity,status,open);
  const create = initialPackageForm(file=>{

function mountPackage(session,actor) {
  packageSession = session;
  session.actor = actor;
  session.handoffChanges = indexHandoffChanges(session.events);
  seenPackageHeads.set(session.manifest.baseline_sha256,session.manifest);
  model = session.project;
  packageVersionBase = undefined;
  const pairs = packagePairs(model);
  const shared = pairs.flatMap(pair=>pair.shared);
  packagePairByContract = new Map(pairs.flatMap(pair=>pair.contracts.map(id=>[id,pair])));
  packageSharedRows = new Map(shared.flatMap(([a,b])=>[[a,b],[b,a]]));
  packageSharedPrimary = new Set(shared.map(([a])=>a));
  packageVersionChoices.clear();
  packageStanceChoices.clear();
  const changedRows = model.stage==="final" ? session.baseline.rows.filter(row=>baselineLawyerChange(row,session.baseline.stage)) :
    model.rows.filter(row=>row.added_by || row.review_history?.length ||
    packageRoles.some(role=>row[role]?.note?.trim()) ||
    (row.original_fields && model.fields.some(field=>get(row,field)!==asText(row.original_fields[field]))));
  session.changedRows = new Set(changedRows.map(row=>row.id));
  for (const event of session.events) trackPackageChanges(event);
  bindModel();
  contractId = packagePairByContract.get(contractId)?.contracts[0] || contractId;
  selected = activeSectionId = openEditor = pendingSide = "";
  linked = true;
  lastUserSide = "left";
  packageDetailPages.clear();
  dirty = false;
  root.replaceChildren();
  launch();
  session.known = snapshotPackageChanges();
  setNotice("已打开 ZIP。修改后可随时导出当前进度。");
}

function snapshotPackageChanges(project=model) {
  return {
    rows:new Map(project.rows.map(row=>[row.id,structuredClone(row)])),
    state:Object.fromEntries(packageStateKeys.map(key=>[key,structuredClone(project[key] ?? null)]))
  };
}
function packageRecordVersion(row) {
  return structuredClone({
    fields:row.fields,contract_id:row.contract_id,rule_id:row.rule_id,
    scope:row.scope,section_id:row.section_id,matter_id:row.matter_id
  });
}
function fixedPackageBindingFields(row) {
  if (packageSharedRows.has(row.id)) return packageBoundFields;
  return packagePairByContract.has(row.contract_id) ? packageSourceFields : [];
}
function invalidatePackageReview(row,before) {
  if (samePackageValue(packageRecordVersion(row),packageRecordVersion(before))) return;
  const role = model.stage;
  const other = role==="student" ? "lawyer" : "student";
  if (other==="student" || packageSession.manifest.round>1 || before[other] || before[other+"_view"]) {
    row[other+"_view"] ||= roleProjection(before,other);
  }
  row[role+"_view"] = packageRecordVersion(row);
  if (role==="student" && row.lawyer?.reviewed) row.lawyer.reviewed = false;
  if (role==="lawyer" && !before.student?.reviewed && !requiresReview(before)) row.lawyer_review_only = true;
}
function roleProjection(row,role) {
  if (role==="lawyer" && model.stage==="lawyer" && packageCurrentRemoval(row)) return packageRecordVersion(row);
  const stored = row[role+"_view"];
  if (stored) return stored;
  const version = packageRecordVersion(row);
  if (role==="student" && row.submitted_fields) version.fields = structuredClone(row.submitted_fields);
  return version;
}
function packageEvent(action,before,next,seq) {
  const {id,name} = packageSession.actor;
  const rows = [];
  for (const [rowId,after] of next.rows) {
    const prior = before.rows.get(rowId) ?? null;
    if (!samePackageValue(prior,after)) rows.push({id:rowId,before:prior,after});
  }
  const state = [];
  for (const key of packageStateKeys) {
    if (!samePackageValue(before.state[key],next.state[key])) state.push({key,before:before.state[key],after:next.state[key]});
  }
  if (!rows.length && !state.length) return null;
  return {id:crypto.randomUUID(),seq,actor_id:id,actor:name,role:model.stage,round:packageSession.manifest.round,
    at:new Date().toISOString(),action,rows,state};
}
const packageBindingChanged = (before,after)=>["contract_id","rule_id","scope","section_id","matter_id"]
  .some(key=>before?.[key]!==after[key]);

function baselineLawyerChange(row,stage) {
  if (row.added_by==="lawyer" || row.lawyer?.note?.trim() ||
      row.review_history?.some(entry=>entry?.stage==="lawyer" && packageJudgmentActions.has(entry.action))) return true;
  const submitted = row.student_view?.fields ?? row.submitted_fields;
  const reviewed = row.lawyer_view ?? (stage==="final" ? row : null);
  return !!submitted && !!reviewed && (model.fields.some(field=>get(reviewed,field)!==asText(submitted[field])) ||
    (!!row.student_view && packageBindingChanged(row.student_view,reviewed)));
}
function trackPackageChanges(event) {
  const final = model.stage==="final";
  if (final && event.role!=="lawyer") return;
  const noteRoles = final ? ["lawyer"] : packageRoles;
  const changedRows = packageSession.changedRows;
  for (const {id,before,after} of event.rows) {
    if (changedRows.has(id)) continue;
    if (!before || !samePackageValue(before.fields,after.fields) || packageBindingChanged(before,after) ||
        !samePackageValue(before.review_history,after.review_history) ||
        noteRoles.some(role=>asText(before[role]?.note)!==asText(after[role]?.note))) changedRows.add(id);
  }
}
function capturePackageChange(action) {
  if (!packageSession?.actor || model.stage==="final") return;
  for (const a of packageSharedPrimary) {
    const b = packageSharedRows.get(a);
    const left = rowById.get(a), right = rowById.get(b);
    const previous = packageSession.known.rows;
    const changedLeft = !samePackageValue(left,previous.get(a));
    const changedRight = !samePackageValue(right,previous.get(b));
    if (changedLeft===changedRight) continue;
    const [source,target] = changedLeft ? [left,right] : [right,left];
    const sourceBefore = previous.get(source.id), targetBefore = previous.get(target.id);
    for (const field of packageFieldNames) {
      if (!packageBoundFields.includes(field)) target.fields[field] = source.fields[field];
    }
    for (const event of (source.review_history || []).slice(sourceBefore.review_history?.length || 0)) {
      (target.review_history ||= []).push({...event,before:{...targetBefore.fields}});
    }
    if (source.review_required) target.review_required = true;
    invalidatePackageReview(target,targetBefore);
    if (source[model.stage]) target[model.stage] = structuredClone(source[model.stage]);
  }
  for (const row of model.rows) {
    const wasReviewed = packageSession.known.rows.get(row.id)?.[model.stage]?.reviewed;
    if (row[model.stage]?.reviewed && !wasReviewed) row[model.stage+"_view"] = packageRecordVersion(row);
  }
  const next = snapshotPackageChanges();
  const event = packageEvent(action,packageSession.known,next,packageSession.events.length+1);
  if (event) {
    packageSession.events.push(event);
    trackPackageChanges(event);
    packageSession.known = next;
    dirty = true;
    const status = byId("package-save-state");
    if (status) status.textContent = "有修改待导出";
  }
}

function safeName(name) {
  return name.replace(/[<>:"/\\|?*\x00-\x1f]/g,"_");
}
function packageExportName(contract,actor,stage,next) {
  const shorten = (value,limit)=>Array.from(safeName(value).replace(/[\s\-]+/g," ").trim()).slice(0,limit).join("").trim();
  const now = new Date();
  const two = value=>String(value).padStart(2,"0");
  const date = now.getFullYear()+two(now.getMonth()+1)+two(now.getDate());
  const time = two(now.getHours())+two(now.getMinutes())+two(now.getSeconds());
  return [shorten(contract,24)||"合同",shorten(actor,12)||"待署名",stage,date+"-"+time,next].join("-");
}
function choosePackageFilename(suggested,extension) {
  const dialog = dialogBox("确认导出文件名");
  dialog.classList.add("package-filename-dialog");
  dialog.setAttribute("aria-label","确认导出文件名");
  const form = node("form");
  const name = node("input");
  name.type = "text";
  name.value = suggested;
  name.required = true;
  name.size = 44;
  const confirm = node("button","下载","primary");
  confirm.type = "submit";
  const actions = node("div",null,"row-actions");
  actions.append(button("取消",()=>dialog.close()),confirm);
  form.append(labelled("文件名（"+extension+"）",name),actions);
  dialog.append(form);
  name.oninput = ()=>name.setCustomValidity("");
  return new Promise(resolve=>{
    let filename;
    form.onsubmit = event=>{
      event.preventDefault();
      let base = name.value.trim();
      if (base.toLowerCase().endsWith(extension)) base = base.slice(0,-extension.length).trim();
      if (!base || base.endsWith(".") || safeName(base)!==base ||
          /^(?:CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\.|$)/i.test(base) ||
          utf8.encode(base+extension).length>240) {
        name.setCustomValidity("请输入有效的文件名，避免系统保留名称、斜杠和其他特殊字符，或缩短文件名。");
        return name.reportValidity();
      }
      filename = base+extension;
      dialog.close();
    };
    dialog.addEventListener("close",()=>resolve(filename),{once:true});
    name.focus();
    name.select();
  });
}

async function savePackage(nextStage) {

    target.review_related = true;
  }
  const next = snapshotPackageChanges(target);
  const event = handoff ? packageEvent(action,packageSession.known,next,packageSession.events.length+1) : null;
  const events = event ? [...packageSession.events,event] : [...packageSession.events];
  const manifest = {
    ...prior,package_id:crypto.randomUUID(),parents:[prior.package_id],revision:prior.revision+1,
    stage:nextStage,

  };

    if (packagePairs(target).length) validatePackageVersionPair(packageSession.baseline,target);
    const zip = await exportReviewPackage(packageSession,manifest,events);
    downloadPackageFile(zip,filename);
    seenPackageHeads.set(manifest.baseline_sha256,manifest);

    if (handoff) {

    } else {
      packageSession.manifest = manifest;
      byId("package-version").textContent = "第 "+manifest.round+" 轮 · 包版本 "+manifest.revision+" · "+manifest.package_id.slice(0,8);
      byId("package-save-state").textContent = "无待导出的修改";

    }
  } catch (error) {
    setNotice("导出失败，当前修改仍保留。"+error.message);
  } finally {
    packageBusy = root.inert = false;
  }
}
const normalizeClauseText = value=>value.replace(/\r\n?/g,"\n");

function clauseMismatchIssue(row,contract,sectionId) {
  const actual = normalizeClauseText(row.fields[keyClause]);
  const section = contract?.sections.find(item=>item.id===sectionId);
  const exactElsewhere = contract?.sections.filter(item=>item.id!==sectionId && normalizeClauseText(item.text)===actual) || [];
  let reason, instruction;
  if (!contract) {
    reason = "这条标注没有对应到数据包中的合同，系统无法核对条款原文。";
    instruction = "进入“编辑字段”，展开“更正合同、规则或切片定位”。选对合同和条款后，工具会带出完整原文。";
  } else if (exactElsewhere.length===1) {
    reason = "字段里的原文完整对应另一条款「"+exactElsewhere[0].heading+"」（"+exactElsewhere[0].id+"），与当前定位不一致。";
    instruction = "核对本卡应该引用哪条，再从“编辑字段”确认或更正定位。工具会按定位带出完整原文。";
  } else if (!section) {
    reason = row.section_id ? "当前定位编号「"+row.section_id+"」在该合同中不存在。" :
      "这条标注未定位到具体条款，当前填写的原文也没有匹配到完整条款。";
    instruction = "进入“编辑字段”，展开“更正合同、规则或切片定位”。选中对应条款后，工具会带出完整原文。";
  } else if (!actual.trim()) {
    reason = "这条标注定位到了具体条款，但“条款原文”为空。";
    instruction = "如果定位正确，恢复该条款的完整原文。";
  } else {
    reason = "“条款原文”与左栏定位到的完整条款不一致。摘录、删字、改写或空白符变化都可能触发这项校验。";
    instruction = "如果定位正确，恢复该条款的完整原文。想摘录支持判断的句子，请放在“风险判断关键证据”；律师意见或拟改文字请分别填在复核意见或修订建议。";
  }
  return {field:keyClause,section,actual,reason,instruction,
    canRestore:!!section && !exactElsewhere.length && contract.name===row.fields["合同附件名称"]};
}

function clauseDifference(actual,expected) {
  const current = Array.from(actual), source = Array.from(normalizeClauseText(expected));
  let at = 0;
  while (at<current.length && at<source.length && current[at]===source[at]) at++;
  const visible = char=>{
    if (!char) return "（已到末尾）";
    const space = {" ":"␠","\t":"⇥","\n":"↵\n","　":"□","\u00a0":"⍽"};
    return space[char] ?? char;
  };
  const snippet = (title,characters)=>{
    const block = node("div",null,"package-issue-snippet");
    const start = Math.max(0,at-18), end = Math.min(characters.length,at+30);
    const line = node("p",null,"wrap");
    if (start) line.append("…");
    line.append(characters.slice(start,at).map(visible).join(""),
      node("mark",visible(characters[at])),characters.slice(at+1,end).map(visible).join(""));
    if (end<characters.length) line.append("…");
    block.append(node("strong",title+"（"+characters.length+" 字符）"),line);
    return block;
  };
  const comparison = node("div",null,"package-issue-comparison");
  comparison.append(node("p","首处差异在第 "+(at+1)+" 个字符。␠ 表示空格，⇥ 表示制表符，↵ 表示换行。","small"),
    snippet("当前标注原文",current),snippet("对应合同原文",source));
  return comparison;
}

function canRemovePackageRow(row) {

function packageRowRemoved(row) {

      (latest?.action===packageJudgmentLabels.clear && relatedUntriggered(row.fields)) ||

function updatePackageJudgment(row,action,evidence="") {
  if (openEditor) return setNotice("请先应用或取消当前字段修改。");
  const triggered = action==="triggered";
  const label = packageJudgmentLabels[action];
  for (const part of sameJudgment(row)) {
    const before = structuredClone(part);
    remember(part,label,"");
    Object.assign(part.fields,{
      [keyRelevant]:part.scope==="full_missing"?"否":"是",
      [riskField]:triggered?"是":"否",
      [keyEvidence]:action==="clear" ? get(part,keyEvidence) : evidence
    });
    if (!triggered) Object.assign(part.fields,{"风险说明":"","修订建议":""});
    invalidatePackageReview(part,before);
    reviewData(part,model.stage).reviewed = false;
  }
  changed(label);
  render(true);
  setNotice("已"+label+"，请确认本条复核。");
}
function markPackageTriggered(row) {
  if (openEditor) return setNotice("请先应用或取消当前字段修改。");
  if (row.scope==="full_missing") return updatePackageJudgment(row,"triggered");
  const dialog = dialogBox("标记为触发");

    const text = evidence.value.trim();
    const excerpts = text.split(/\n\s*\n/).filter(part=>part.trim());
    const compact = value=>value.replace(/[\r\n\t \u3000\u00a0]+/g,"");
    const clause = compact(get(row,keyClause));
    if (!compact(text) || (!clause.includes(compact(text)) && excerpts.some(part=>!clause.includes(compact(part))))) {
      message.textContent = "请填写能在本条款原文中定位的关键证据。";
      return evidence.focus();
    }
    dialog.close();
    updatePackageJudgment(row,"triggered",text);
  },"primary"));
  evidence.focus();
}

function latestPackageFieldEdit(row) {
  const version = packageRecordVersion(row);
  for (let index = packageSession.events.length-1; index>=0; index--) {
    const event = packageSession.events[index];
    if (event.round!==packageSession.manifest.round || event.role!==model.stage) break;
    const change = event.rows.find(item=>item.id===row.id);
    if (!change) continue;
    if (!change.before || !samePackageValue(change.before.review_history,change.after.review_history)) break;
    const after = packageRecordVersion(change.after);
    if (samePackageValue(packageRecordVersion(change.before),after)) continue;
    if (event.action==="编辑标注字段" && samePackageValue(version,after)) return event;
    break;
  }
}
function undoPackageFieldEdit(row) {
  if (openEditor) return setNotice("请先应用或取消当前字段修改。");
  const edit = latestPackageFieldEdit(row);
  if (!edit) return;
  const peer = packageSharedRows.get(row.id);
  for (const {id,before} of edit.rows) {
    if (id!==row.id && id!==peer) continue;
    const current = rowById.get(id);
    const applied = structuredClone(current);
    for (const [key,value] of Object.entries(packageRecordVersion(before))) {
      if (value===undefined) delete current[key];
      else current[key] = value;
    }
    invalidatePackageReview(current,applied);
    for (const key of ["review_required","lawyer_review_only"]) {
      if (before[key]===undefined) delete current[key];
      else current[key] = before[key];
    }
    if (requiresReview(current)) reviewData(current,model.stage).reviewed = false;
  }
  changed("撤回已应用的字段修改");
  render(true);
  const detail = packageDetailPages.get(model.stage)?.element;
  (detail?.querySelector(".package-field-toggle") || detail?.querySelector(".package-detail-back"))?.focus({preventScroll:true});
  setNotice("已恢复上次应用前的字段。"+(requiresReview(row) ? "请重新确认这张风险卡。" : ""));
}
