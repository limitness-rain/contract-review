function finalPackageIssues(project,requireOpinion=true) {
  const issues = [];
  const contracts = new Map(project.contracts.map(contract=>[contract.id,contract]));
  const rules = new Map(project.rules.map(rule=>[rule.id,rule]));
  const keyFor = (contract,rule,matter)=>JSON.stringify([contract,rule,matter || ""]);
  const paths = new Map();
  const groups = new Map();
  const judgments = new Map();
  const normalize = normalizeClauseText;
  const compact = text=>text.replace(/[\r\n\t \u3000\u00a0]+/g,"");
  const units = new Map(project.contracts.map(contract=>[contract.id,
    new Map(contract.sections.map(section=>[section.id,normalize(section.text)]))]));
  function issueContext(contractId,ruleId,sectionId,scope,row) {
    const contract = contracts.get(contractId), rule = rules.get(ruleId);
    const section = contract?.sections.find(item=>item.id===sectionId);
    const location = scope==="full_missing" ? "全文缺失 · 整份合同" : section?.heading || (row ? "尚未定位条款" : "");
    return {
      title:row ? "标注记录" : "规则覆盖校验",rowId:row?.id,contractId,section,
      contractName:contract?.name || (row && get(row,"合同附件名称")) || "合同未匹配",
      riskName:(row && get(row,"风险名称")) || rule?.name,stance:(row && get(row,"立场")) || rule?.stance,
      location:[location,sourceRowLabel(row?.id)].filter(Boolean).join(" · "),problems:[]
    };
  }
  function coverageIssue(path,reason,sectionId) {
    const item = issueContext(path.contract_id,path.rule_id,sectionId,path.mode);
    item.problems.push({field:"规则覆盖",reason,instruction:"请对照建包时的覆盖清单，核对该规则应有的记录。"});
    issues.push(item);
  }
  for (const path of project.paths || []) {
    const key = keyFor(path.contract_id,path.rule_id,path.matter_id);
    if (paths.has(key) || !contracts.has(path.contract_id) || !rules.has(path.rule_id) ||
        !["slice","related","full_missing"].includes(path.mode)) coverageIssue(path,"覆盖清单中的规则、合同或审查方式无效，或重复配置了同一条覆盖路径。");
    paths.set(key,path);
  }
  for (const [contractId,ruleIds] of Object.entries(project.applicability || {})) {
    for (const ruleId of ruleIds) {
      if (![...paths.values()].some(path=>path.contract_id===contractId && path.rule_id===ruleId)) {
        coverageIssue({contract_id:contractId,rule_id:ruleId},"这条适用规则在该合同上没有配置覆盖路径。");
      }
    }
  }
  for (const row of project.rows) {
    const fields = row.fields;
    const contract = contracts.get(row.contract_id), rule = rules.get(row.rule_id);
    const contractUnits = units.get(row.contract_id);
    const groupKey = keyFor(row.contract_id,row.rule_id,row.matter_id);
    const clauseText = normalize(get(row,keyClause));
    const section = row.section_id || (contractUnits ? [...contractUnits].findLast(([,text])=>text===clauseText)?.[0] : undefined);
    let scope = row.scope || (clauseText ? "slice" : "unlinked");
    const type = packageCardType(fields);
    if (scope==="unlinked" && (paths.get(groupKey)?.mode==="full_missing" ||
        (!clauseText.trim() && (type==="no-clause" || type==="no-attention")))) scope="full_missing";
    const item = issueContext(row.contract_id,row.rule_id,section,scope,row);
    const problems = item.problems;
    const add = (field,reason,options={})=>{
      if (!problems.some(problem=>problem.field===field && problem.reason===reason)) problems.push({field,reason,...options});
    };
    const badFields = packageFieldNames.filter(field=>typeof fields?.[field]!=="string");
    if (badFields.length || !fields || Object.keys(fields).length!==packageFieldNames.length) {
      add("标注字段格式",badFields.length ? "以下字段缺少有效的文本值："+badFields.join("、")+"。" :
        "记录中有标准 15 列以外的字段。",{instruction:"请核对来源标注集的表头和单元格格式。"});
      issues.push(item);
      continue;
    }
    const [file,category,clause,risk,stance,relevant,trigger,level,logic,relatedType,attribute,related,evidence] =
      packageFieldNames.map(field=>normalize(fields[field]));
    if (!contract) add("合同附件名称","这条标注尚未绑定到包内的合同。",{
      instruction:"在「编辑字段」中展开「更正合同、规则或切片定位」，选择对应的合同。"});
    else if (contract.name!==file) add("合同附件名称","当前填的是「"+(file || "留空")+"」，对应的合同文件名应为「"+contract.name+"」。",{editField:"合同附件名称"});
    if (!rule) add("专家规则定位","这条标注尚未绑定到包内的专家规则。",{
      instruction:"在「编辑字段」中展开「更正合同、规则或切片定位」，选择对应规则和立场。",editBinding:true});
    else for (const [field,actual,expected] of [
      ["风险名称",risk,rule.name],["立场",stance,rule.stance],["风险等级",level,rule.level],["审查逻辑",logic,rule.logic]
    ]) {
      if (actual!==normalize(expected || "")) add(field,field==="审查逻辑" ?
        "当前审查逻辑与绑定的专家规则不一致。" :
        "当前填的是「"+(actual || "留空")+"」，绑定规则要求「"+(expected || "留空")+"」。",

        instruction:"请核对初始标注集，或通过标注卡片的判断操作修正。"});
    }
    for (const [field,value] of [["条款类型",category],["关联条款类型",relatedType]]) {
      if (/^[A-Z]+\d+(?:\s|[.、：:]|$)/.test(value) || (value && project.clause_types?.length && !project.clause_types.includes(value))) {

      }
    }
    if (attribute && !["引用","例外","生效条件","定义来源","优先适用"].includes(attribute)) {
      add("关联条款属性","「"+attribute+"」不是有效属性。可选引用、例外、生效条件、定义来源或优先适用。",{editField:"关联条款属性"});
    }
    if (scope==="full_missing") {
      for (const [field,value] of [[keyClause,clause],[keyEvidence,type==="no-attention" ? "" : evidence.trim()],["条款类型",category]]) {
        if (value) add(field,"全文缺失记录的这个字段应留空。",{editField:field});
      }
      if (relevant!=="否") add(keyRelevant,"全文缺失记录没有主条款，相关性应为「否」。");
      if (row.section_id) add("条款定位","全文缺失记录应以整份合同为审查对象。");
    } else {
      if (!clause || contractUnits?.get(section)!==clause) problems.push(clauseMismatchIssue(row,contract,section));
      if (relevant==="是" && trigger==="是" && !evidence) {

      }
    }
    if (clause && evidence && !compact(clause).includes(compact(evidence)) &&
        evidence.split(/\n\s*\n/).filter(part=>part.trim()).some(part=>!compact(clause).includes(compact(part)))) {
      add(keyEvidence,"至少一段证据在当前主条款中找不到。请逐段核对并摘录左侧原文字句。",{editField:keyEvidence});
    }

    const logical = JSON.stringify([scope,section,related]);

    members.set(logical,{scope,section,rowId:row.id});

      if (!packageRoles.includes(event?.stage)) add("复核记录","有一条历史操作缺少有效的复核人角色。",{logs:true});

          !canRemovePackageRow({...row,fields:event.before}) || !packageFieldNames.every(field=>Object.hasOwn(event.before || {},field)))) {
        add("删除记录","删卡记录缺少原因或删除前的完整标注。",{logs:true});
      }
    }
    if (requiresReview(row)) {
      if (!row.student?.reviewed && row.lawyer_review_only!==true) {
        add("实习生复核","这条记录缺少实习生确认，请核对实习生提交的 ZIP。",{logs:packageCurrentRemoval(row)});
      }
      if (!row.lawyer?.reviewed) add("律师复核",packageCurrentRemoval(row) ?
        "这条卡已删除，请到复核记录确认删除结果。" : "这条记录尚未确认，请打开律师栏标注并确认。",{logs:packageCurrentRemoval(row)});
      const needsOpinion = project.review_related===true ? wasRisk(row) : requiresRiskReview(row);
      if (requireOpinion && needsOpinion && !hasLawyerOpinion(row)) {
        add("律师复核意见","这条历史终版记录需要有律师复核意见。",{logs:packageCurrentRemoval(row)});
      }
    }
    if (problems.length) issues.push(item);
  }
  for (const [key,path] of paths) {
    const scope = path.mode==="full_missing" ? "full_missing" : "slice";
    const expected = new Set(scope==="full_missing" ? [undefined] :
      path.mode==="slice" ? units.get(path.contract_id)?.keys() : path.section_ids || []);
    const actual = new Set();
    for (const member of groups.get(key)?.values() || []) {
      if (member.scope!==scope || !expected.has(member.section)) {
        const row = project.rows.find(item=>item.id===member.rowId);

        issue.problems.push({field:"规则覆盖",reason:"这条记录的审查范围或主条款与覆盖清单不一致。"});
        issues.push(issue);
      } else actual.add(member.section);
    }
    if (!expected.size) coverageIssue(path,"覆盖清单没有列出应检查的条款。");

    if (questionReviewed(question)) continue;

      problems:[{reason:"请填写律师答复，并勾选「确认此问题已审核」。"}]});
  }
  return issues;
}

function splitReviewSentences(value) {
  return value.match(/[^。！？!?；;\r\n]*(?:[。！？!?；;]+[”’」』）】]*|\r?\n+|\r|$)/g)?.filter(Boolean) || [];
}

function sentenceChanges(before,after) {
  let start = 0;
  let oldEnd = before.length, newEnd = after.length;
  while (start<oldEnd && start<newEnd && before[start]===after[start]) start++;
  while (oldEnd>start && newEnd>start && before[oldEnd-1]===after[newEnd-1]) {
    oldEnd--;
    newEnd--;
  }
  const oldSize = oldEnd-start, newSize = newEnd-start;
  if (!oldSize && !newSize) return [];
  if (!oldSize || !newSize || oldSize*newSize>250000) return [[start,oldEnd,start,newEnd]];
  const width = newSize+1;
  const lengths = new Uint32Array((oldSize+1)*width);
  for (let i=oldSize-1;i>=0;i--) {
    for (let j=newSize-1;j>=0;j--) {
      const cell = i*width+j;
      lengths[cell] = before[start+i]===after[start+j] ? 1+lengths[cell+width+1] :
        Math.max(lengths[cell+width],lengths[cell+1]);
    }
  }
  const changes = [];
  let i = 0, j = 0, pending;
  while (i<oldSize || j<newSize) {
    if (i<oldSize && j<newSize && before[start+i]===after[start+j]) {
      if (pending) changes.push([pending[0],start+i,pending[1],start+j]);
      pending = null;
      i++;
      j++;
    } else {
      pending ||= [start+i,start+j];
      if (j===newSize || (i<oldSize && lengths[(i+1)*width+j]>=lengths[i*width+j+1])) i++;
      else j++;
    }
  }
  if (pending) changes.push([pending[0],oldEnd,pending[1],newEnd]);
  return changes;
}

function sentenceExcerpt(sentences,changes,side) {
  const start = Math.max(0,changes[0][side]-2);
  const end = Math.min(sentences.length,changes.at(-1)[side+1]+2);
  const paragraph = node("p",null,"wrap");
  if (start) paragraph.append("…\n");
  let position = start;
  for (const change of changes) {
    const [from,to] = change.slice(side,side+2);
    paragraph.append(sentences.slice(position,from).join(""));
    paragraph.append(from===to ? node("span","（此处无对应文字）","small") :
      node("mark",sentences.slice(from,to).join("")));
    position = to;
  }
  paragraph.append(sentences.slice(position,end).join(""));
  if (end<sentences.length) paragraph.append("\n…");
  return paragraph;
}

function appendReviewFields(values,original,view,[beforeTitle,afterTitle]) {
  original ||= {};
  for (const field of model.fields) {
    const before = asText(original[field]), after = get(view,field);
    if (!Object.hasOwn(original,field) || before===after) {
      detailItem(values,field,after);
      continue;
    }
    const oldSentences = splitReviewSentences(before);
    const newSentences = splitReviewSentences(after);
    const changes = sentenceChanges(oldSentences,newSentences);
    const groups = [];
    for (const change of changes) {
      const previous = groups.at(-1);
      if (previous && change[0]-previous.at(-1)[1]<=4 && change[2]-previous.at(-1)[3]<=4) previous.push(change);
      else groups.push([change]);
    }
    const label = node("dt",field,"package-diff-label");
    label.append(node("span","有改动","badge package-change-edited"));
    const value = node("dd",null,"package-diff-value");
    for (const group of groups) {
      const comparison = node("div",null,"package-sentence-diff");
      for (const [headline,sentences,side] of [[beforeTitle,oldSentences,0],[afterTitle,newSentences,2]]) {
        const excerpt = node("div");
        excerpt.append(node("strong",headline),sentenceExcerpt(sentences,group,side));
        comparison.append(excerpt);
      }
      value.append(comparison);
    }
    if (groups.length>1 || groups.some(group=>group[0][0]>2 || group.at(-1)[1]+2<oldSentences.length ||
      group[0][2]>2 || group.at(-1)[3]+2<newSentences.length)) {
      const full = node("details");
      full.append(node("summary","查看完整字段"),node("strong",beforeTitle),
        node("p",before || "（留空）","wrap small"),node("strong",afterTitle),node("p",after || "（留空）","wrap small"));
      value.append(full);
    }
    values.append(label,value);
  }
}

  if (row.scope === "full_missing") return "";

  if (!clause && !evidence) return "";
  const explicit = sections.find(section => section.id === String(row.section_id ?? ""));
  if (explicit && (!clause || norm(explicit.text).includes(clause) || norm(explicit.heading + explicit.text).includes(clause))) return explicit.id;

  for (const probe of [clause, evidence].filter(Boolean)) {

function resetRiskFilters(id) {

function evidenceRanges(section, rows) {
  const ranges = [];
  for (const row of rows) {
    const evidence = get(row, keyEvidence).trim();
    if (!evidence) continue;
    const snippets = section.text.includes(evidence) ? [evidence] : evidence.split(/\r?\n/);
    for (const snippet of snippets.map(value => value.trim()).filter(Boolean)) {
      let start = section.text.indexOf(snippet);
      while (start >= 0) {
        ranges.push({start,end:start + snippet.length,id:row.id});
        start = section.text.indexOf(snippet,start + snippet.length);

  return ranges.sort((a,b) => a.start - b.start || a.end - b.end);

function markedText(section, rows) {

  const rows = filterRows().filter(row => requiresReview(row) && !isReviewed(row));
  if (!rows.length) return setNotice("当前筛选没有需要确认的记录。");
  const missingOpinions = model.stage === "lawyer" ? rows.filter(row => !hasLawyerOpinion(row)).length : 0;
  if (missingOpinions) return setNotice("当前筛选中有 "+missingOpinions+" 张风险卡缺少律师复核意见，请逐条填写后再确认。");
  if (!window.confirm("确认已人工复核此合同当前筛选中的 " + rows.length + " "+item+"？")) return;
  rows.forEach(row => { reviewData(row,model.stage).reviewed = true; });
  changed("确认当前筛选的风险卡");
  render(true);
  setNotice("已确认当前筛选中的 " + rows.length + " "+item+"。");
}
function plainEntries(value) {
  if (Array.isArray(value)) return value;
  return value ? [value] : [];
}
function reportLinks(dialog, title, entries) {
  const list = node("ul");
  dialog.append(node("h3",title),list);
  if (!entries.length) list.append(node("li","包内无此类记录。"));
  for (const entry of entries) {
    if (typeof entry !== "object" || !entry) {
      list.append(node("li",asText(entry),"wrap"));
      continue;
    }
    const item = node("li", null,"wrap");
    if (entry.check && entry.message) item.append(node("strong",asText(entry.check)),document.createTextNode("　"+entry.message));
    else {
      const labels = Object.entries(entry).filter(([key]) => key !== "row_id");
      for (const [key,value] of labels) {
        item.append(node("p",key+"　"+(typeof value === "object" ? JSON.stringify(value) : asText(value))));
      }
    }
    if (entry.row_id != null && rowById.has(String(entry.row_id)) && get(rowById.get(String(entry.row_id)),riskField)==="是") {
      const id = String(entry.row_id);
      item.append(button("查看记录",() => {
        dialog.close();
        if (openEditor) return setNotice("请先应用或取消当前编辑。");
        resetRiskFilters(rowById.get(id).contract_id);
        if (packageMode) revealPackageRowVersion(rowById.get(id));
        render();
        focusRow(id);
      }));
    }
    list.append(item);
  }
}
function report() {
  if (openEditor) return setNotice("请先应用或取消当前编辑。");
  const dialog = node("dialog");
  dialog.append(button("关闭",()=>dialog.close(),"close"),node("h2","预埋记录与检查报告"),node("p","此处显示生成页面时保存的结果。修改标注后，用包内工具重新校验。","small"));
  reportLinks(dialog,"预埋风险记录",plainEntries(model.risk_changes));
  reportLinks(dialog,"检查报告",plainEntries(model.checks));
  dialog.addEventListener("close",()=>dialog.remove());
  document.body.append(dialog);
  dialog.showModal();
}
function enablePanelResizing(study) {
  const panes = [...study.children];
  const dividers = [];
  const readWidths = () => panes.map(pane=>pane.getBoundingClientRect().width);
  function updateValues(widths) {
    dividers.forEach((divider,index)=>{
      const pair = widths[index] + widths[index+1];
      const minimum = Math.min(200,pair/2);
      divider.setAttribute("aria-valuemin",Math.round(100*minimum/pair));
      divider.setAttribute("aria-valuemax",Math.round(100*(pair-minimum)/pair));
      divider.setAttribute("aria-valuenow",Math.round(100*widths[index]/pair));
    });
  }
  function resize(index,widths,nextWidth) {
    const pair = widths[index] + widths[index+1];
    const minimum = Math.min(200,pair/2);
    const next = Math.max(minimum,Math.min(pair-minimum,nextWidth));
    const result = widths.slice();
    result[index] = next;
    result[index+1] = pair-next;
    study.style.setProperty("--panel-columns",result.map(width=>`minmax(0,${width}fr)`).join(" 12px "));
    updateValues(result);
  }
  panes.slice(0,-1).forEach((pane,index)=>{
    const divider = node("div",null,"panel-divider");
    divider.tabIndex = 0;
    divider.setAttribute("role","separator");
    divider.setAttribute("aria-orientation","vertical");
    divider.setAttribute("aria-controls",pane.querySelector(".scroller").id);
    const names = panes.slice(index,index+2).map(item=>item.querySelector("h2").textContent);
    divider.setAttribute("aria-label","调整"+names.join("和")+"的宽度");
    divider.title = "拖动调整宽度，双击恢复默认";
    divider.onpointerdown = event => {
      if (event.button !== 0 || divider.hasPointerCapture(event.pointerId)) return;
      const widths = readWidths();
      const start = event.clientX;
      divider.setPointerCapture(event.pointerId);
      divider.classList.add("dragging");
      document.body.classList.add("resizing-panels");
      divider.onpointermove = move => {
        if (move.pointerId === event.pointerId) resize(index,widths,widths[index]+move.clientX-start);
      };
      divider.onlostpointercapture = () => {
        divider.onpointermove = null;
        divider.classList.remove("dragging");
        document.body.classList.remove("resizing-panels");
      };
      event.preventDefault();
    };
    divider.onkeydown = event => {
      const widths = readWidths();
      const targets = {ArrowLeft:widths[index]-24,ArrowRight:widths[index]+24,Home:0,End:Infinity};
      if (!Object.hasOwn(targets,event.key)) return;
      event.preventDefault();
      resize(index,widths,targets[event.key]);
    };
    divider.ondblclick = () => {
      study.style.removeProperty("--panel-columns");
      updateValues(readWidths());
    };
    pane.after(divider);
    dividers.push(divider);
  });
  const observer = new ResizeObserver(()=>updateValues(readWidths()));
  observer.observe(study);
}
function launch() {
  indexRows();
  const view = node("div",null,packageMode ? "view package-view" : "view");
  const header = node("header");
  const actions = node("div",null,"header-actions");
  const title = model.contract_type || model.title || "合同标注复核";
  const heading = node("h1",title);
  document.title = title + " · " + stageNames[model.stage];
  packageHeader(actions);
  header.append(heading,node("span",stageNames[model.stage],"badge"),actions);
  heading.title = title;
  const status = node("p","修改后请导出 ZIP 数据包。","status");
  status.id = "message";
  status.setAttribute("role","status");
  if (packageMode) {
    const info = packageInfo();
    info.append(status);
    header.append(info);
  }
  const toolbar = node("div",null,"toolbar");
  const attachments = model.contracts.flatMap(item=>{
    const pair = packageMode && packagePairByContract.get(item.id);
    if (pair && pair.contracts[0]!==item.id) return [];
    return [[String(item.id),pair ? packagePairName(pair) : item.name]];
  });
  if (!packageMode || model.rows.some(row=>!contractById.has(row.contract_id))) {
    attachments.push(["","未匹配到合同的记录"]);
  }
  const contract = choose("contract",attachments);
  const contractLabel = packageMode ? "合同附件名称" : "合同";
  contract.setAttribute("aria-label",contractLabel);
  contract.value = contractId;
  const stances = [...new Set(model.rows.map(row=>get(row,"立场")).filter(Boolean))].sort();
  const stance = choose("stance",[["","全部"],...(packageMode ? packageVersionOptions() : stances.map(value=>[value,value]))]);
  stance.setAttribute("aria-label","立场");
  const changeStatus = packageMode ? choose("change-status",[["","全部"],["changed","有改动"],["unchanged","未改动"]]) : null;
  changeStatus?.setAttribute("aria-label","改动状态");
  const scope = choose("scope",packageMode ?
    [["review","全部类型"],...packageCardLabels] :
    [["review","全部类型"],["slice","触发风险"],["no-clause","缺失风险"]]);
  const reviewStatus = choose("review-status",[["","全部状态"],["unreviewed","未复核"],["reviewed","已复核"]]);
  scope.setAttribute("aria-label","风险类型");
  reviewStatus.setAttribute("aria-label","复核状态");
  const search = node("input");
  search.id = "search";
  search.type = "search";
  search.placeholder = "风险名称、证据或记录号";
  const sync = node("input");
  sync.type = "checkbox";
  sync.checked = true;
  sync.onchange = () => {
    linked = sync.checked;
    if (linked) syncPanes(lastUserSide);
  };
  const reviewFilter = labelled(packageMode ? "当前栏复核状态" : "复核状态",reviewStatus);
  reviewFilter.hidden = packageMode && model.stage==="final";
  toolbar.append(labelled(contractLabel,contract),labelled("立场",stance),labelled("风险类型",scope),reviewFilter);
  if (changeStatus) toolbar.append(labelled("改动状态",changeStatus));
  toolbar.append(labelled("搜索",search),labelled("联动滚动",sync));
  const study = node("main",null,hasLawyerPane ? "study with-lawyer" : "study");
  for (const [side,label] of [["left","合同原文"],["right","实习生标注与复核"]]) {
    const pane = node("section",null,"pane");
    const heading = node("div",null,"pane-heading");
    heading.append(node("h2",label));
    if (side === "right") {
      const tools = node("span",null,"toolbar-line");
      const match = node("span",null,"small");
      match.id = "match";
      tools.append(match);
      if (!packageMode || model.stage==="student") tools.append(reviewProgressLabel());
      if (model.stage === "student") {
        const commands = [button("新增全文缺失风险",()=>addAnnotation(null)),button(packageMode ? "确认所有未复核的标注" : "确认当前筛选的风险卡",confirmCurrent)];
        if (packageMode) tools.append(packageMenu("操作", [...commands,button("提出合同问题",()=>editDiscussion("question"))]));
        else tools.append(...commands);
      }
      heading.append(tools);
    }
    const scroller = node("div",null,"scroller");
    scroller.id = side;
    scroller.setAttribute("tabindex","0");
    scroller.setAttribute("aria-label",label);
    scroller.addEventListener("scroll",()=>onScroll(side),{passive:true});
    scroller.addEventListener("toggle",refreshScrollTail,true);
    pane.append(heading,scroller);
    study.append(pane);
  }
  if (hasLawyerPane) {
    const pane = node("section",null,"pane");
    const heading = node("div",null,"pane-heading");
    heading.append(node("h2","律师复核"));
    const tools = node("div",null,"toolbar-line");
    if (packageMode && model.stage!=="student") tools.append(reviewProgressLabel());
    if (model.stage === "lawyer") {
      const commands = [button("新增全文缺失风险",()=>addAnnotation(null)),
        button(packageMode ? "确认所有未复核的标注" : "确认当前筛选的风险卡",confirmCurrent)];
      if (packageMode) tools.append(packageMenu("操作",commands));
      else {
        const add = button("新增风险批注",addLawyerAnnotation);
        add.onpointerdown = event => { if (selectedClauseEvidence()) event.preventDefault(); };
        tools.append(add,...commands,button("新建建议",()=>editDiscussion("suggestion")),button("复核记录",showLogs));
      }
    }
    if (tools.children.length) heading.append(tools);
    const scroller = node("div",null,"scroller");
    scroller.id = "lawyer-pane";
    scroller.tabIndex = 0;
    scroller.setAttribute("aria-label","律师复核");
    if (packageMode) {
      scroller.addEventListener("scroll",()=>onScroll("lawyer-pane"),{passive:true});
      scroller.addEventListener("toggle",refreshScrollTail,true);
    }
    pane.append(heading,scroller);
    study.append(pane);
  }
  if (packageMode) view.append(header,toolbar,study);
  else view.append(header,status,toolbar,study);
  root.append(view);
  enablePanelResizing(study);
  const resize = new ResizeObserver(refreshScrollTail);
  resize.observe(byId("left"));
  resize.observe(byId("right"));
  if (packageMode) resize.observe(byId("lawyer-pane"));
  const filters = [contract,stance,scope,reviewStatus,changeStatus,search].filter(Boolean);
  for (const input of filters) input.addEventListener(input===search ? "input" : "change",() => {
    if (openEditor) {
      input.value = input.dataset.past || "";
      return setNotice("请先应用或取消当前编辑，再切换筛选。");
    }
    const versionChange = packageMode && input===stance;
    const keepScroll = versionChange || input===changeStatus;
    const anchor = activeSectionId;
    if (keepScroll) {
      for (const role of [...packageDetailPages.keys()]) closePackageDetail(role);
      input.focus({preventScroll:true});
    }
    if (versionChange) setPackageVersionFilter(input.value);
    if (input===contract) {
      if (packageMode) configurePackageContract(contract.value);
      else contractId = contract.value;
    }
    input.dataset.past = input.value;
    selected = "";
    lastUserSide = "left";
    render(keepScroll);
    if (versionChange && input.value) animatePackageFlip(leftSections.has(anchor) ? anchor : leftSections.keys().next().value);
  });
  for (const input of filters) input.dataset.past = input.value;

  render();
}
window.addEventListener("beforeunload",event => {
  if (openEditor || dirty) {
    event.preventDefault();
    event.returnValue = true;
  }
});
if (packageMode) bootPackage();
else root.textContent = "请打开已构建的合同复核工具.html。";
</script>
